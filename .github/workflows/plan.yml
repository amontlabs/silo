name: Plan

# The plan both ways, in one job so that whichever run survives in the queue does everything: the
# owner's verdicts (labels on the entries' issues) to plan/ on main as a commit, then the plan on
# main to GitHub. Sync compares each issue against the commit in its silo-synced marker, so it needs
# the whole history. Not verified until the owner has created the App and set its two secrets.
on:
  push:
    branches: [main]
  issues:
    types: [labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    # Only the three verdict labels (compared ignoring case); the label's name is never put in a script.
    if: github.event_name != 'issues' || contains(fromJSON('["verdict:take","verdict:later","verdict:drop"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # On the job, so that a skipped job never enters the group.
    concurrency:
      group: plan
      cancel-in-progress: false
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: plan pull --commit
        env:
          WORKSHOP_APP_ID: ${{ secrets.WORKSHOP_APP_ID }}
          WORKSHOP_PRIVATE_KEY: ${{ secrets.WORKSHOP_PRIVATE_KEY }}
        run: tools/plan/bin/plan pull --commit
      - name: plan check
        run: tools/plan/bin/plan check
      - name: Push to main
        env:
          PUSH_TOKEN: ${{ github.token }}
          WORKSHOP_APP_ID: ${{ secrets.WORKSHOP_APP_ID }}
          WORKSHOP_PRIVATE_KEY: ${{ secrets.WORKSHOP_PRIVATE_KEY }}
        run: tools/plan/bin/push-main
      - name: plan sync
        if: ${{ !cancelled() }}
        env:
          WORKSHOP_APP_ID: ${{ secrets.WORKSHOP_APP_ID }}
          WORKSHOP_PRIVATE_KEY: ${{ secrets.WORKSHOP_PRIVATE_KEY }}
        run: tools/plan/bin/plan sync
