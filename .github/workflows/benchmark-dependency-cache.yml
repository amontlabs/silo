name: Benchmark public Cargo dependency reuse

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silo-dependency-cache-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
    uses: ./.github/workflows/benchmark-dependency-platform.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
