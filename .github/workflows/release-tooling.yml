name: Verify release tooling

on:
  pull_request:
    paths:
      - 'app/SiloUI/.changeset/**'
      - 'app/SiloUI/scripts/**'
      - 'app/SiloUI/package*.json'
      - 'app/SiloUI/runtime-inputs.json'
      - 'app/SiloUI/patches/**'
      - 'app/SiloUI/src-tauri/src/dependencies.rs'
      - 'app/SiloUI/src-tauri/Cargo.*'
      - 'app/SiloUI/src-tauri/guest/**'
      - 'app/SiloUI/src-tauri/build.rs'
      - 'app/SiloUI/src-tauri/src/main.rs'
      - '.github/workflows/*release*.yml'
      - '.github/workflows/apt-repository.yml'
      - '.github/actions/prepare-release-runtime/**'
  push:
    branches: [main]
    paths:
      - 'app/SiloUI/.changeset/**'
      - 'app/SiloUI/scripts/**'
      - 'app/SiloUI/package*.json'
      - 'app/SiloUI/runtime-inputs.json'
      - 'app/SiloUI/patches/**'
      - 'app/SiloUI/src-tauri/src/dependencies.rs'
      - 'app/SiloUI/src-tauri/Cargo.*'
      - 'app/SiloUI/src-tauri/guest/**'
      - 'app/SiloUI/src-tauri/build.rs'
      - 'app/SiloUI/src-tauri/src/main.rs'
      - '.github/workflows/*release*.yml'
      - '.github/workflows/apt-repository.yml'
      - '.github/actions/prepare-release-runtime/**'

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/SiloUI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: node scripts/preflight.mjs
      - run: npm ci
      - run: npm run test:release
      - run: python3 scripts/validate-release-version.py
      - run: python3 scripts/check-command-manifest.py
      - run: sudo apt-get update && sudo apt-get install -y gnupg dpkg-dev
      # Discover every script test so new test files cannot be silently skipped.
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
