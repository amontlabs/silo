name: Warm Silo release caches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/actions/prepare-release-runtime/**'
      - '.github/workflows/warm-release-caches.yml'
      - 'app/SiloUI/scripts/prepare-microsandbox-runtime.mjs'
      - 'app/SiloUI/scripts/microsandbox-runtime.mjs'
      - 'app/SiloUI/scripts/git-runtime.mjs'
      - 'app/SiloUI/scripts/lfs-transfer-runtime.mjs'
      - 'app/SiloUI/patches/microsandbox-*.patch'
      - 'app/SiloUI/runtime-inputs.json'
      - 'app/SiloUI/scripts/preflight.mjs'
      - 'app/SiloUI/src-tauri/Cargo.lock'
      - 'app/SiloUI/src-tauri/Cargo.toml'
      - 'app/SiloUI/src-tauri/tauri.conf.json'
      - 'app/SiloUI/src-tauri/vendor/**'
      - '**/.cargo/config*'
      - 'app/SiloUI/scripts/*dependency*.py'
      - 'app/SiloUI/package-lock.json'

permissions:
  contents: read
concurrency:
  group: silo-release-cache-warmer
  cancel-in-progress: false

jobs:
  warm:
    # Only default-branch caches can be shared by all version tags.
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      SILO_GITHUB_APP_SLUG: silo-cache-warmer
      SILO_GITHUB_CLIENT_ID: synthetic-cache-client
      SILO_GITHUB_CLIENT_SECRET: SILO-CACHE-PRODUCER-CONFIG-SENTINEL
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate runtime inputs before installation or downloads
        run: node app/SiloUI/scripts/preflight.mjs
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libclang-dev libcap-ng-dev cmake libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
          test "$(rustc --print host-tuple)" = '${{ matrix.target }}'
      # No signing environment or GitHub App credentials enter this job.
      - uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ matrix.runner }}
          target: ${{ matrix.target }}
          save: 'true'
      - name: Install frontend toolchain
        run: npm --prefix app/SiloUI ci
      - name: Resolve exact public dependency identity
        id: dependencies
        working-directory: app/SiloUI
        run: python3 scripts/release-dependency-cache.py prepare --target '${{ matrix.target }}' --state "$RUNNER_TEMP/release-dependencies" >> "$GITHUB_OUTPUT"
      - name: Check existing public dependency cache
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-dependencies/cache
          key: ${{ steps.dependencies.outputs.key }}
          lookup-only: true
      - name: Compile with synthetic configuration on cache miss
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        working-directory: app/SiloUI
        run: python3 scripts/measure-command.py dependency-warm-build -- python3 scripts/release-dependency-cache.py build --target '${{ matrix.target }}' --state "$RUNNER_TEMP/release-dependencies"
      - name: Export and audit reviewed public dependencies only
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        working-directory: app/SiloUI
        run: python3 scripts/release-dependency-cache.py export --target '${{ matrix.target }}' --state "$RUNNER_TEMP/release-dependencies"
      - name: Save audited public dependency cache from main only
        if: github.ref == 'refs/heads/main' && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-dependencies/cache
          key: ${{ steps.dependencies.outputs.key }}
