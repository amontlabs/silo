name: Plan sync

# The plan on main to GitHub: issues, their text and state, history comments, labels.
# Sync compares each issue against the commit in its silo-synced marker, so it needs the whole
# history. Not verified until the owner has created the App and set its two secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One group with plan-verdict, on the job so that a skipped job never enters it.
    concurrency:
      group: plan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: plan sync
        env:
          WORKSHOP_APP_ID: ${{ secrets.WORKSHOP_APP_ID }}
          WORKSHOP_PRIVATE_KEY: ${{ secrets.WORKSHOP_PRIVATE_KEY }}
        run: tools/plan/bin/plan sync
