name: Linux packaging

# A release-mode Debian package and AppImage take a while to build, so this runs
# only when packaging inputs change, and nightly to catch drift from dependencies
# and the runner image. It mirrors the release build's packaging steps without
# signing and never uploads or distributes the packages it builds.
on:
  push:
    branches: [main]
    paths:
      - 'app/SiloUI/src-tauri/tauri*.conf.json'
      - 'app/SiloUI/src-tauri/icons/**'
      - 'app/SiloUI/src-tauri/src/bundled_tools.rs'
      - 'app/SiloUI/scripts/debian/**'
      - 'app/SiloUI/scripts/package-debian-release.py'
      - 'app/SiloUI/scripts/build_desktop.py'
      - 'app/SiloUI/scripts/linux-package-tools.mjs'
      - 'app/SiloUI/scripts/prepare-microsandbox-runtime.mjs'
      - 'app/SiloUI/scripts/microsandbox-runtime.mjs'
      - 'app/SiloUI/scripts/git-runtime.mjs'
      - 'app/SiloUI/scripts/lfs-transfer-runtime.mjs'
      - 'app/SiloUI/scripts/build-input.mjs'
      - 'app/SiloUI/scripts/preflight.mjs'
      - 'app/SiloUI/runtime-inputs.json'
      - 'app/SiloUI/guest-image/image-lock.json'
      - 'app/SiloUI/package.json'
      - 'app/SiloUI/package-lock.json'
      - '.github/actions/prepare-release-runtime/**'
      - '.github/workflows/linux-packaging.yml'
  pull_request:
    paths:
      - 'app/SiloUI/src-tauri/tauri*.conf.json'
      - 'app/SiloUI/src-tauri/icons/**'
      - 'app/SiloUI/src-tauri/src/bundled_tools.rs'
      - 'app/SiloUI/scripts/debian/**'
      - 'app/SiloUI/scripts/package-debian-release.py'
      - 'app/SiloUI/scripts/build_desktop.py'
      - 'app/SiloUI/scripts/linux-package-tools.mjs'
      - 'app/SiloUI/scripts/prepare-microsandbox-runtime.mjs'
      - 'app/SiloUI/scripts/microsandbox-runtime.mjs'
      - 'app/SiloUI/scripts/git-runtime.mjs'
      - 'app/SiloUI/scripts/lfs-transfer-runtime.mjs'
      - 'app/SiloUI/scripts/build-input.mjs'
      - 'app/SiloUI/scripts/preflight.mjs'
      - 'app/SiloUI/runtime-inputs.json'
      - 'app/SiloUI/guest-image/image-lock.json'
      - 'app/SiloUI/package.json'
      - 'app/SiloUI/package-lock.json'
      - '.github/actions/prepare-release-runtime/**'
      - '.github/workflows/linux-packaging.yml'
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packaging-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Debian package and AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app/SiloUI
    env:
      GOTOOLCHAIN: local
      # Synthetic values from the release guide. These packages only prove
      # packaging: they cannot sign in to GitHub and are never distributed.
      SILO_GITHUB_APP_SLUG: silo-ci-test
      SILO_GITHUB_CLIENT_ID: test-client
      SILO_GITHUB_CLIENT_SECRET: test-secret
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Linux build and packaging dependencies and the pinned Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libclang-dev libcap-ng-dev cmake libfuse2t64 squashfs-tools file gstreamer1.0-libav dpkg-dev xdg-utils
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
      - run: npm ci
      - name: Prepare native resources
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
      # Same layout as the release bundle: tools under /usr/libexec/silo/tools
      # (tauri.linux.package.conf.json), without updater artifacts or signing.
      - name: Bundle the Debian package and AppImage
        run: npm run desktop:build -- --bundles deb,appimage --ci
      - name: Add maintainer scripts and check the packaged tool layout
        run: |
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          python3 scripts/package-debian-release.py "${packages[0]}"
          dpkg-deb --info "${packages[0]}"
          echo "SILO_DEB=$PWD/${packages[0]}" >> "$GITHUB_ENV"
      # Resolves the declared dependencies from Ubuntu and runs the real
      # maintainer scripts on this disposable runner.
      - name: Install and remove the package
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "$SILO_DEB"
          test -x /usr/bin/silo-ui
          for tool in msb git git-lfs git-remote-http git-remote-https; do
            test -x "/usr/libexec/silo/tools/$tool"
          done
          test -x /usr/bin/ssh
          test -x /usr/bin/ssh-keygen
          test ! -e /var/lib/silo/package-update-in-progress
          sudo env DEBIAN_FRONTEND=noninteractive apt-get purge -y silo
          test ! -e /usr/bin/silo-ui
      - name: Check the AppImage
        run: |
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          image="$PWD/${images[0]}"
          chmod +x "$image"
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/silo-ui
          for tool in msb git git-lfs git-remote-http git-remote-https; do
            test -x "squashfs-root/usr/libexec/silo/tools/$tool"
          done
