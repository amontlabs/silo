name: Build and verify one Silo platform

on:
  workflow_call:
    inputs:
      source-ref:
        default: ''
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      bundles:
        required: true
        type: string
      asset:
        required: true
        type: string
      draft:
        required: true
        type: boolean
      benchmark-schedule:
        default: parallel
        type: string
      signing:
        description: adhoc, dry-run (stubbed notarization) or developer-id
        default: adhoc
        type: string
    secrets:
      SILO_GITHUB_APP_SLUG:
        required: false
      SILO_GITHUB_CLIENT_ID:
        required: false
      SILO_GITHUB_CLIENT_SECRET:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      APPLE_CERTIFICATE_P12_BASE64:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_DEVELOPER_ID_IDENTITY:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false

permissions:
  contents: read

jobs:
  # The exact public cache key includes this platform's build tools, so it is looked up on the
  # platform's own runner. On a hit the job ends there and the native and package jobs restore the
  # cache; on a miss it prepares once and hands both jobs its archive.
  runtime:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      RUNTIME_TARGET: ${{ inputs.target }}
    outputs:
      cache-hit: ${{ steps.lookup.outputs.cache-hit }}
      artifact-name: ${{ steps.archive.outputs.artifact-name }}
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check exact public runtime cache
        id: lookup
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ inputs.runner }}
          target: ${{ inputs.target }}
          lookup-only: 'true'
      - name: Explain one-time cold preparation
        if: steps.lookup.outputs.cache-hit != 'true'
        run: echo 'Exact runtime cache was missing. Prepare once for both native and package jobs on this platform.'
      - name: Install pinned Rust toolchain
        if: steps.lookup.outputs.cache-hit != 'true'
        shell: bash
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
          test "$(rustc --print host-tuple)" = "$RUNTIME_TARGET"
      # No environment, signing key, or GitHub App configuration enters this job.
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ inputs.runner }}
          target: ${{ inputs.target }}
      - name: Archive allowlisted public runtime inputs
        if: steps.lookup.outputs.cache-hit != 'true'
        id: archive
        shell: bash
        run: |
          python3 app/SiloUI/scripts/release-runtime-cache.py pack --archive "$RUNNER_TEMP/runtime-cache.tar.gz" >> "$GITHUB_OUTPUT"
          echo "artifact-name=runtime-cache-$RUNTIME_TARGET-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          path: ${{ runner.temp }}/runtime-cache.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Upload timing metrics only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-timings-${{ inputs.target }}
          path: ${{ runner.temp }}/build-phases.jsonl
          if-no-files-found: ignore
          retention-days: 7

  native-tests:
    needs: runtime
    if: ${{ !cancelled() && inputs.benchmark-schedule != 'sequential' && needs.runtime.result == 'success' }}
    runs-on: ${{ inputs.runner }}
    # Headroom: runtime:prepare took about 20 minutes on macos-15 when the cache was stale.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/SiloUI
        shell: bash
    env:
      GOTOOLCHAIN: local
      RUNTIME_TARGET: ${{ inputs.target }}
      SILO_GITHUB_APP_SLUG: silo-unit-test
      SILO_GITHUB_CLIENT_ID: synthetic-unit-client
      SILO_GITHUB_CLIENT_SECRET: synthetic-unit-secret
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
          test "$(rustc --print host-tuple)" = "$RUNTIME_TARGET"
      - run: npm ci
      - uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ inputs.runner }}
          target: ${{ inputs.target }}
          artifact-name: ${{ needs.runtime.outputs.artifact-name }}
          artifact-sha256: ${{ needs.runtime.outputs.archive-sha256 }}
      - name: Test build configuration and native behavior
        run: python3 scripts/measure-command.py native-tests -- cargo test --manifest-path Cargo.toml --workspace --locked --timings -- --test-threads=1
      - name: Test updater transport and interrupted installation
        run: python3 scripts/measure-command.py updater-tests -- cargo test --manifest-path src-tauri/Cargo.toml --locked -p tauri-plugin-updater --lib -- --test-threads=1
      - name: Upload timing metrics only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-timings-${{ inputs.target }}
          path: ${{ runner.temp }}/build-phases.jsonl
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: runtime
    if: ${{ !cancelled() && needs.runtime.result == 'success' }}
    environment: ${{ inputs.draft && 'release-signing' || 'release-verification' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app/SiloUI
        shell: bash
    # GitHub App values and signing keys are step-scoped: only the steps that
    # compile Silo see the App configuration, and only the steps that sign see
    # the updater key. npm, Homebrew, Python tests and other build scripts never do.
    env:
      GOTOOLCHAIN: local
      RUNTIME_TARGET: ${{ inputs.target }}
      RELEASE_BUNDLES: ${{ inputs.bundles }}
      RELEASE_ASSET: ${{ inputs.asset }}
      APPLE_SIGNING_IDENTITY: '-'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require GitHub App configuration
        env:
          SILO_GITHUB_APP_SLUG: ${{ secrets.SILO_GITHUB_APP_SLUG }}
          SILO_GITHUB_CLIENT_ID: ${{ secrets.SILO_GITHUB_CLIENT_ID }}
          SILO_GITHUB_CLIENT_SECRET: ${{ secrets.SILO_GITHUB_CLIENT_SECRET }}
        run: |
          for key in SILO_GITHUB_APP_SLUG SILO_GITHUB_CLIENT_ID SILO_GITHUB_CLIENT_SECRET; do
            if [[ -z "${!key//[[:space:]]/}" ]]; then
              echo "::error::Missing Actions secret $key. See docs/SiloUI-RELEASES.md."
              exit 1
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - name: Install pinned Rust toolchain
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
          test "$(rustc --print host-tuple)" = "$RUNTIME_TARGET"
      - name: Install signature verifier
        if: runner.os == 'macOS'
        run: brew install minisign
      - run: npm ci
      - name: Resolve public dependency identity before test signing configuration
        id: dependencies
        run: python3 scripts/release-dependency-cache.py prepare --target "$RUNTIME_TARGET" --state "$RUNNER_TEMP/release-dependencies" >> "$GITHUB_OUTPUT"
      - name: Generate isolated test signing key
        if: ${{ !inputs.draft }}
        run: |
          umask 077
          npx tauri signer generate --ci -p '' -w "$RUNNER_TEMP/silo-test.key" >/dev/null
          echo "SILO_TEST_SIGNING_KEY=$RUNNER_TEMP/silo-test.key" >> "$GITHUB_ENV"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path('src-tauri/tauri.conf.json')
          config = json.loads(path.read_text())
          config['plugins']['updater']['pubkey'] = Path(os.environ['RUNNER_TEMP'], 'silo-test.key.pub').read_text().strip()
          path.write_text(json.dumps(config))
          PYCODE
      - name: Require production signing key
        if: inputs.draft
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*release*.py'
      - name: Prepare native resources
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ inputs.runner }}
          target: ${{ inputs.target }}
          artifact-name: ${{ needs.runtime.outputs.artifact-name }}
          artifact-sha256: ${{ needs.runtime.outputs.archive-sha256 }}
      - name: Test build configuration and native behavior
        if: inputs.benchmark-schedule == 'sequential'
        env:
          SILO_GITHUB_APP_SLUG: ${{ secrets.SILO_GITHUB_APP_SLUG }}
          SILO_GITHUB_CLIENT_ID: ${{ secrets.SILO_GITHUB_CLIENT_ID }}
          SILO_GITHUB_CLIENT_SECRET: ${{ secrets.SILO_GITHUB_CLIENT_SECRET }}
        run: python3 scripts/measure-command.py native-tests -- cargo test --manifest-path Cargo.toml --workspace --locked --timings -- --test-threads=1
      - name: Test updater transport and interrupted installation
        if: inputs.benchmark-schedule == 'sequential'
        run: python3 scripts/measure-command.py updater-tests -- cargo test --manifest-path src-tauri/Cargo.toml --locked -p tauri-plugin-updater --lib -- --test-threads=1
      - name: Free test products before release compilation
        if: inputs.benchmark-schedule == 'sequential'
        run: cargo clean --manifest-path src-tauri/Cargo.toml --profile dev
      - name: Restore public release dependencies only
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-dependencies/cache
          key: ${{ steps.dependencies.outputs.key }}
      - name: Validate dependencies or fall back to ordinary compilation
        run: |
          python3 scripts/release-dependency-cache.py restore --target "$RUNTIME_TARGET" --state "$RUNNER_TEMP/release-dependencies"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/app/SiloUI/src-tauri/target/release-compile" >> "$GITHUB_ENV"
      - name: Compile release application
        env:
          SILO_GITHUB_APP_SLUG: ${{ secrets.SILO_GITHUB_APP_SLUG }}
          SILO_GITHUB_CLIENT_ID: ${{ secrets.SILO_GITHUB_CLIENT_ID }}
          SILO_GITHUB_CLIENT_SECRET: ${{ secrets.SILO_GITHUB_CLIENT_SECRET }}
        run: python3 scripts/measure-command.py release-build -- python3 scripts/release-dependency-cache.py build --target "$RUNTIME_TARGET" --state "$RUNNER_TEMP/release-dependencies"
      - name: Build release bundles
        env:
          # Drafts sign with the production key; verification runs use the
          # isolated key generated above.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.draft && secrets.TAURI_SIGNING_PRIVATE_KEY || env.SILO_TEST_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.draft && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          python3 scripts/measure-command.py release-bundle -- python3 scripts/retry-bundle.py --log "$RUNNER_TEMP/silo-bundle.log" -- npx tauri bundle --target "$RUNTIME_TARGET" --bundles "$RELEASE_BUNDLES" --ci --verbose
      # The verbose bundle log stays on the runner: it can contain signing and
      # build configuration details (see scripts/retry-bundle.py).
      - name: Build the engine (silod) and the silo command for the macOS bundle
        if: runner.os == 'macOS'
        env:
          # The silo command's channel comes from this identifier; without it, it is Silo Dev's.
          SILO_CHANNEL_IDENTIFIER: org.silo.preview
        run: cargo build --locked --release -p silod -p silo-cli --target "$RUNTIME_TARGET"
      # A draft with no Apple credentials is signed ad hoc and not notarized only when the
      # repository variable SILO_RELEASE_ALLOW_UNNOTARIZED is true; otherwise every credential is
      # required. Other modes pass through unchanged.
      - name: Resolve the macOS signing mode
        id: signing
        if: runner.os == 'macOS'
        env:
          SILO_RELEASE_SIGNING: ${{ inputs.signing }}
          SILO_RELEASE_ALLOW_UNNOTARIZED: ${{ vars.SILO_RELEASE_ALLOW_UNNOTARIZED }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ inputs.signing == 'developer-id' && secrets.APPLE_CERTIFICATE_P12_BASE64 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.signing == 'developer-id' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ inputs.signing == 'developer-id' && secrets.APPLE_DEVELOPER_ID_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ inputs.signing == 'developer-id' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY_P8: ${{ inputs.signing == 'developer-id' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ inputs.signing == 'developer-id' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ inputs.signing == 'developer-id' && secrets.APPLE_API_ISSUER_ID || '' }}
        run: |
          mode=$(python3 scripts/macos_notarization.py resolve-mode)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/signing-mode"
          echo "$mode" > "$RUNNER_TEMP/signing-mode/signing-mode.txt"
      # The draft job reads the resolved mode to label the draft page.
      - name: Upload the resolved signing mode
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-mode-${{ inputs.asset }}
          path: ${{ runner.temp }}/signing-mode/signing-mode.txt
          if-no-files-found: error
          retention-days: 7
      # Only a Developer ID draft imports the certificate, into a temporary keychain that the
      # cleanup step below deletes. Dry runs and artifact-only builds never see it.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain=$(python3 scripts/macos_notarization.py import-certificate)
          echo "SILO_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Enforce exact macOS runtime libraries, sign, notarize and rebuild signed packages
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.draft && secrets.TAURI_SIGNING_PRIVATE_KEY || env.SILO_TEST_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.draft && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          SILO_RELEASE_SIGNING: ${{ steps.signing.outputs.mode }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.APPLE_DEVELOPER_ID_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY_P8: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.APPLE_API_ISSUER_ID || '' }}
        run: python3 scripts/package-macos-release.py "src-tauri/target/release-compile/$RUNTIME_TARGET/release/bundle/macos/Silo.app" release-assets --engine "src-tauri/target/release-compile/$RUNTIME_TARGET/release/silod" --cli "src-tauri/target/release-compile/$RUNTIME_TARGET/release/silo"
      - name: Verify macOS library constraints
        if: runner.os == 'macOS'
        run: python3 scripts/test-macos-library-constraints.py --constraints-only --output "$RUNNER_TEMP/library-constraints"
      - name: Collect and verify macOS assets
        if: runner.os == 'macOS'
        env:
          SILO_RELEASE_SIGNING: ${{ steps.signing.outputs.mode }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.APPLE_DEVELOPER_ID_IDENTITY || '' }}
        run: |
          mkdir -p release-assets
          bundle="src-tauri/target/release-compile/$RUNTIME_TARGET/release/bundle"
          codesign --verify --deep --strict "$bundle/macos/Silo.app"
          python3 scripts/verify-macos-signing.py "$bundle/macos/Silo.app"
          test -s release-assets/Silo-macos-arm64.app.tar.gz
          test -s release-assets/Silo-macos-arm64.app.tar.gz.sig
          test -s release-assets/Silo-macos-arm64.dmg
      - name: Delete the temporary signing keychain
        if: always() && runner.os == 'macOS' && steps.signing.outputs.mode == 'developer-id'
        run: python3 scripts/macos_notarization.py delete-keychain "$SILO_SIGNING_KEYCHAIN"
      - name: Verify update signatures
        run: python3 scripts/verify-release-signatures.py release-assets
      - name: Verify signed package versions and architectures
        run: python3 scripts/verify-release-metadata.py release-assets "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.asset }}
          path: app/SiloUI/release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload timing metrics only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-timings-${{ inputs.target }}
          path: ${{ runner.temp }}/build-phases.jsonl
          if-no-files-found: ignore
          retention-days: 7
