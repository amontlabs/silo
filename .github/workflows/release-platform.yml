name: Build and verify one Silo platform

on:
  workflow_call:
    inputs:
      source-ref:
        default: ''
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      bundles:
        required: true
        type: string
      asset:
        required: true
        type: string
      draft:
        required: true
        type: boolean
      runtime-cache-hit:
        required: true
        type: boolean
      benchmark-schedule:
        default: parallel
        type: string
    secrets:
      SILO_GITHUB_APP_SLUG:
        required: false
      SILO_GITHUB_CLIENT_ID:
        required: false
      SILO_GITHUB_CLIENT_SECRET:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  runtime:
    if: ${{ !inputs.runtime-cache-hit }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      RUNTIME_TARGET: ${{ inputs.target }}
    outputs:
      artifact-name: ${{ steps.archive.outputs.artifact-name }}
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Explain one-time cold preparation
        run: echo 'Exact runtime cache was missing. Prepare once for both native and package jobs on this platform.'
      - name: Install runtime compiler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libclang-dev libcap-ng-dev cmake
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
          test "$(rustc --print host-tuple)" = "$RUNTIME_TARGET"
      # No environment, signing key, or GitHub App configuration enters this job.
      - uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ inputs.runner }}
          target: ${{ inputs.target }}
      - name: Archive allowlisted public runtime inputs
        id: archive
        shell: bash
        run: |
          python3 app/SiloUI/scripts/release-runtime-cache.py pack --archive "$RUNNER_TEMP/runtime-cache.tar.gz" >> "$GITHUB_OUTPUT"
          echo "artifact-name=runtime-cache-$RUNTIME_TARGET-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          path: ${{ runner.temp }}/runtime-cache.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Upload timing metrics only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-timings-${{ inputs.target }}
          path: ${{ runner.temp }}/build-phases.jsonl
          if-no-files-found: ignore
          retention-days: 7

  native-tests:
    needs: runtime
    if: ${{ !cancelled() && inputs.benchmark-schedule != 'sequential' && (needs.runtime.result == 'success' || needs.runtime.result == 'skipped') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/SiloUI
        shell: bash
    env:
      GOTOOLCHAIN: local
      RUNTIME_TARGET: ${{ inputs.target }}
      SILO_GITHUB_APP_SLUG: silo-unit-test
      SILO_GITHUB_CLIENT_ID: synthetic-unit-client
      SILO_GITHUB_CLIENT_SECRET: synthetic-unit-secret
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libclang-dev libcap-ng-dev cmake gstreamer1.0-libav fish
      - name: Install pinned Rust toolchain
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
          test "$(rustc --print host-tuple)" = "$RUNTIME_TARGET"
      - run: npm ci
      - uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ inputs.runner }}
          target: ${{ inputs.target }}
          artifact-name: ${{ needs.runtime.outputs.artifact-name }}
          artifact-sha256: ${{ needs.runtime.outputs.archive-sha256 }}
      - name: Test build configuration and native behavior
        run: python3 scripts/measure-command.py native-tests -- cargo test --manifest-path Cargo.toml --workspace --locked --timings -- --test-threads=1
      - name: Test updater transport and interrupted installation
        run: python3 scripts/measure-command.py updater-tests -- cargo test --manifest-path src-tauri/Cargo.toml --locked -p tauri-plugin-updater --lib -- --test-threads=1
      - name: Upload timing metrics only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-timings-${{ inputs.target }}
          path: ${{ runner.temp }}/build-phases.jsonl
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: runtime
    if: ${{ !cancelled() && (needs.runtime.result == 'success' || needs.runtime.result == 'skipped') }}
    environment: ${{ inputs.draft && 'release-signing' || 'release-verification' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app/SiloUI
        shell: bash
    # GitHub App values and signing keys are step-scoped: only the steps that
    # compile Silo see the App configuration, and only the steps that sign see
    # the updater key. npm, Homebrew, Python tests and other build scripts never do.
    env:
      GOTOOLCHAIN: local
      RUNTIME_TARGET: ${{ inputs.target }}
      RELEASE_BUNDLES: ${{ inputs.bundles }}
      RELEASE_ASSET: ${{ inputs.asset }}
      APPLE_SIGNING_IDENTITY: '-'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require GitHub App configuration
        env:
          SILO_GITHUB_APP_SLUG: ${{ secrets.SILO_GITHUB_APP_SLUG }}
          SILO_GITHUB_CLIENT_ID: ${{ secrets.SILO_GITHUB_CLIENT_ID }}
          SILO_GITHUB_CLIENT_SECRET: ${{ secrets.SILO_GITHUB_CLIENT_SECRET }}
        run: |
          for key in SILO_GITHUB_APP_SLUG SILO_GITHUB_CLIENT_ID SILO_GITHUB_CLIENT_SECRET; do
            if [[ -z "${!key//[[:space:]]/}" ]]; then
              echo "::error::Missing Actions secret $key. See docs/SiloUI-RELEASES.md."
              exit 1
            fi
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libclang-dev libcap-ng-dev cmake libfuse2t64 minisign squashfs-tools file gstreamer1.0-libav fish xdg-utils
      - name: Install pinned Rust toolchain
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
          test "$(rustc --print host-tuple)" = "$RUNTIME_TARGET"
      - name: Install signature verifier
        if: runner.os == 'macOS'
        run: brew install minisign
      - run: npm ci
      - name: Resolve public dependency identity before test signing configuration
        id: dependencies
        run: python3 scripts/release-dependency-cache.py prepare --target "$RUNTIME_TARGET" --state "$RUNNER_TEMP/release-dependencies" >> "$GITHUB_OUTPUT"
      - name: Generate isolated test signing key
        if: ${{ !inputs.draft }}
        run: |
          umask 077
          npx tauri signer generate --ci -p '' -w "$RUNNER_TEMP/silo-test.key" >/dev/null
          echo "SILO_TEST_SIGNING_KEY=$RUNNER_TEMP/silo-test.key" >> "$GITHUB_ENV"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path('src-tauri/tauri.conf.json')
          config = json.loads(path.read_text())
          config['plugins']['updater']['pubkey'] = Path(os.environ['RUNNER_TEMP'], 'silo-test.key.pub').read_text().strip()
          path.write_text(json.dumps(config))
          PYCODE
      - name: Require production signing key
        if: inputs.draft
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*release*.py'
      - name: Prepare native resources
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ inputs.runner }}
          target: ${{ inputs.target }}
          artifact-name: ${{ needs.runtime.outputs.artifact-name }}
          artifact-sha256: ${{ needs.runtime.outputs.archive-sha256 }}
      - name: Test build configuration and native behavior
        if: inputs.benchmark-schedule == 'sequential'
        env:
          SILO_GITHUB_APP_SLUG: ${{ secrets.SILO_GITHUB_APP_SLUG }}
          SILO_GITHUB_CLIENT_ID: ${{ secrets.SILO_GITHUB_CLIENT_ID }}
          SILO_GITHUB_CLIENT_SECRET: ${{ secrets.SILO_GITHUB_CLIENT_SECRET }}
        run: python3 scripts/measure-command.py native-tests -- cargo test --manifest-path Cargo.toml --workspace --locked --timings -- --test-threads=1
      - name: Test updater transport and interrupted installation
        if: inputs.benchmark-schedule == 'sequential'
        run: python3 scripts/measure-command.py updater-tests -- cargo test --manifest-path src-tauri/Cargo.toml --locked -p tauri-plugin-updater --lib -- --test-threads=1
      - name: Free test products before release compilation
        if: inputs.benchmark-schedule == 'sequential'
        run: cargo clean --manifest-path src-tauri/Cargo.toml --profile dev
      - name: Restore public release dependencies only
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-dependencies/cache
          key: ${{ steps.dependencies.outputs.key }}
      - name: Validate dependencies or fall back to ordinary compilation
        run: |
          python3 scripts/release-dependency-cache.py restore --target "$RUNTIME_TARGET" --state "$RUNNER_TEMP/release-dependencies"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/app/SiloUI/src-tauri/target/release-compile" >> "$GITHUB_ENV"
      - name: Compile release application
        env:
          SILO_GITHUB_APP_SLUG: ${{ secrets.SILO_GITHUB_APP_SLUG }}
          SILO_GITHUB_CLIENT_ID: ${{ secrets.SILO_GITHUB_CLIENT_ID }}
          SILO_GITHUB_CLIENT_SECRET: ${{ secrets.SILO_GITHUB_CLIENT_SECRET }}
        run: python3 scripts/measure-command.py release-build -- python3 scripts/release-dependency-cache.py build --target "$RUNTIME_TARGET" --state "$RUNNER_TEMP/release-dependencies"
      - name: Build release bundles
        env:
          # Drafts sign with the production key; verification runs use the
          # isolated key generated above.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.draft && secrets.TAURI_SIGNING_PRIVATE_KEY || env.SILO_TEST_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.draft && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            bundle_config_args=(--config src-tauri/tauri.linux.package.conf.json)
          else
            bundle_config_args=()
          fi
          python3 scripts/measure-command.py release-bundle -- python3 scripts/retry-bundle.py --log "$RUNNER_TEMP/silo-bundle.log" -- npx tauri bundle --target "$RUNTIME_TARGET" --bundles "$RELEASE_BUNDLES" --ci --verbose "${bundle_config_args[@]}"
      # The verbose bundle log stays on the runner: it can contain signing and
      # build configuration details (see scripts/retry-bundle.py).
      - name: Enforce exact macOS runtime libraries and rebuild signed packages
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.draft && secrets.TAURI_SIGNING_PRIVATE_KEY || env.SILO_TEST_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.draft && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: python3 scripts/package-macos-release.py "src-tauri/target/release-compile/$RUNTIME_TARGET/release/bundle/macos/Silo.app" release-assets
      - name: Verify macOS library constraints
        if: runner.os == 'macOS'
        run: python3 scripts/test-macos-library-constraints.py --constraints-only --output "$RUNNER_TEMP/library-constraints"
      - name: Collect and verify macOS assets
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          bundle="src-tauri/target/release-compile/$RUNTIME_TARGET/release/bundle"
          codesign --verify --deep --strict "$bundle/macos/Silo.app"
          python3 scripts/verify-macos-signing.py "$bundle/macos/Silo.app"
          test -s release-assets/Silo-macos-arm64.app.tar.gz
          test -s release-assets/Silo-macos-arm64.app.tar.gz.sig
          test -s release-assets/Silo-macos-arm64.dmg
      - name: Collect and verify Linux assets
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          packages=("src-tauri/target/release-compile/$RUNTIME_TARGET/release/bundle/deb/"*.deb)
          test "${#packages[@]}" -eq 1
          python3 scripts/package-debian-release.py "${packages[0]}"
          dpkg-deb --info "${packages[0]}"
          cp "${packages[0]}" "release-assets/Silo-$RELEASE_ASSET.deb"
          images=("src-tauri/target/release-compile/$RUNTIME_TARGET/release/bundle/appimage/"*.AppImage)
          test "${#images[@]}" -eq 1
          cp "${images[0]}" "release-assets/Silo-$RELEASE_ASSET.AppImage"
          cp "${images[0]}.sig" "release-assets/Silo-$RELEASE_ASSET.AppImage.sig"
          chmod +x "release-assets/Silo-$RELEASE_ASSET.AppImage"
          "release-assets/Silo-$RELEASE_ASSET.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/silo-ui
      - name: Verify update signatures
        run: python3 scripts/verify-release-signatures.py release-assets
      - name: Verify signed package versions and architectures
        run: python3 scripts/verify-release-metadata.py release-assets "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.asset }}
          path: app/SiloUI/release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload timing metrics only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-timings-${{ inputs.target }}
          path: ${{ runner.temp }}/build-phases.jsonl
          if-no-files-found: ignore
          retention-days: 7

