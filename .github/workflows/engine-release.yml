name: Publish Silo engine

# Publishes the prebuilt engine as the release engine-v<version>: the silod
# (Apple Silicon) that other apps embed, and the Linux host engines (x86-64 and
# arm64). <version> is the silod crate version, also engineVersion in the
# production engine manifest. Push a tag engine-v<version>, or run this workflow
# from main to create the tag and release at that commit.
# See docs/SiloUI-RELEASES.md#engine-releases.
on:
  push:
    tags: ['engine-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silo-engine-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The release's tag, checked once before any build starts: every build needs it.
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine the engine tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('app/SiloUI/src-tauri/silod/Cargo.toml', 'rb'))['package']['version'])")
          tag="engine-v$version"
          if [[ "$EVENT" == workflow_dispatch ]]; then
            if [[ "$REF" != refs/heads/main ]]; then
              echo "::error::Run this workflow from main, not $REF."
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::$tag already exists; raise the silod version before releasing again."
              exit 1
            fi
          elif [[ "$REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $REF_NAME must be $tag, the silod version in Cargo.toml."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain for Apple Silicon
        run: |
          set -euo pipefail
          toolchain=$(python3 -c "import json; print(json.load(open('app/SiloUI/runtime-inputs.json'))['toolchain'])")
          rustup toolchain install "$toolchain" --profile minimal --target aarch64-apple-darwin
          rustup default "$toolchain"
      # silo-engine compiles the GitHub App configuration in, as the Silo app does.
      - name: Build and package the engine
        id: package
        working-directory: app/SiloUI
        env:
          SILO_GITHUB_APP_SLUG: ${{ secrets.SILO_GITHUB_APP_SLUG }}
          SILO_GITHUB_CLIENT_ID: ${{ secrets.SILO_GITHUB_CLIENT_ID }}
          SILO_GITHUB_CLIENT_SECRET: ${{ secrets.SILO_GITHUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python3 scripts/package-engine.py --out-dir "$RUNNER_TEMP/engine-release" --source-commit "$GITHUB_SHA"
          echo "archive=$(basename "$RUNNER_TEMP"/engine-release/*.tar.gz)" >> "$GITHUB_OUTPUT"
      - name: Verify the archive
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          version="${TAG#engine-v}"
          test "$ARCHIVE" = "silo-engine-$version-macos-arm64.tar.gz"
          cd "$RUNNER_TEMP/engine-release"
          test "$(ls | wc -l)" -eq 2
          shasum -a 256 -c "$ARCHIVE.sha256"
          mkdir extracted
          tar -xzf "$ARCHIVE" -C extracted
          engine="extracted/silo-engine-$version"
          archs=$(lipo -archs "$engine/bin/silod")
          [[ "$archs" == arm64 ]] || { echo "::error::silod has architectures: $archs"; exit 1; }
          python3 - "$engine" "$version" "$GITHUB_SHA" <<'PY'
          import json, sys
          engine, version, commit = sys.argv[1:]
          info = json.load(open(f'{engine}/release.json'))
          assert info['engineVersion'] == version and info['sourceCommit'] == commit, info
          assert info['targets'] == ['aarch64-apple-darwin'], info
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silo-engine
          path: |
            ${{ runner.temp }}/engine-release/*.tar.gz
            ${{ runner.temp }}/engine-release/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # A Linux host engine: silod, the silo command and the bundled runtime in one
  # directory (docs/SiloUI-ENGINE.md#silod-on-a-linux-host). Each architecture
  # builds natively, because runtime:prepare builds MicroSandbox for the host.
  build-linux:
    needs: tag
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            machine: X86-64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            machine: AArch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The MicroSandbox build needs libclang and libcap-ng; silod links D-Bus for
      # keyring's optional Secret Service backend.
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev libcap-ng-dev libdbus-1-dev cmake
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(python3 -c "import json; print(json.load(open('app/SiloUI/runtime-inputs.json'))['toolchain'])")
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      # Pinned, checksummed MicroSandbox, libkrunfw and Git; restores the caches
      # that main populates and never saves from here.
      - name: Prepare the runtime
        timeout-minutes: 45
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ matrix.runner }}
          target: ${{ matrix.target }}
      - name: Build and package the Linux engine
        id: package
        working-directory: app/SiloUI
        env:
          PLATFORM: ${{ matrix.platform }}
          SILO_GITHUB_APP_SLUG: ${{ secrets.SILO_GITHUB_APP_SLUG }}
          SILO_GITHUB_CLIENT_ID: ${{ secrets.SILO_GITHUB_CLIENT_ID }}
          SILO_GITHUB_CLIENT_SECRET: ${{ secrets.SILO_GITHUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python3 scripts/package-engine.py --platform "$PLATFORM" --out-dir "$RUNNER_TEMP/engine-release" --source-commit "$GITHUB_SHA"
          echo "archive=$(basename "$RUNNER_TEMP"/engine-release/*.tar.gz)" >> "$GITHUB_OUTPUT"
      - name: Verify the Linux archive
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          version="${TAG#engine-v}"
          test "$ARCHIVE" = "silo-engine-$version-$PLATFORM.tar.gz"
          cd "$RUNNER_TEMP/engine-release"
          test "$(ls | wc -l)" -eq 2
          sha256sum -c "$ARCHIVE.sha256"
          mkdir extracted
          tar -xzf "$ARCHIVE" -C extracted
          engine=extracted/silo-engine
          for executable in silod silo msb git; do
            readelf -h "$engine/$executable" | grep -q "Machine:.*$MACHINE" || { echo "::error::$executable is not $MACHINE"; exit 1; }
          done
          # The silo command is the production channel's, like the manifest.
          test "$("$engine/silo" --print-channel-identifier)" = org.silo.preview
          python3 - "$engine" "$version" "$GITHUB_SHA" "$TARGET" <<'PY'
          import json, sys
          engine, version, commit, target = sys.argv[1:]
          info = json.load(open(f'{engine}/release.json'))
          assert info['engineVersion'] == version and info['sourceCommit'] == commit, info
          assert info['targets'] == [target], info
          manifest = json.load(open(f'{engine}/resources/engine-manifest.json'))
          assert manifest['channelIdentifier'] == 'org.silo.preview', manifest
          assert manifest['engineBuild'] == f'silo-{commit}', manifest
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silo-engine-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/engine-release/*.tar.gz
            ${{ runner.temp }}/engine-release/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    # Both Linux builds and the macOS build must succeed: a release is never partial.
    needs: [tag, build, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: silo-engine*
          merge-multiple: true
          path: engine-release
      - name: Create the engine release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.tag.outputs.tag }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          set -euo pipefail
          cd engine-release
          version="${TAG#engine-v}"
          linux=("silo-engine-$version-linux-x64.tar.gz" "silo-engine-$version-linux-arm64.tar.gz")
          test "$(ls | wc -l)" -eq 6
          for archive in "$ARCHIVE" "${linux[@]}"; do
            sha256sum -c "$archive.sha256"
          done
          # A tag push already has its tag; a dispatch creates it at the built commit.
          if [[ "$EVENT" == workflow_dispatch ]]; then
            tag_flag=(--target "$GITHUB_SHA")
          else
            tag_flag=(--verify-tag)
          fi
          # Not "latest": the Silo app's update feed reads releases/latest.
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            "${linux[0]}" "${linux[0]}.sha256" "${linux[1]}" "${linux[1]}.sha256" \
            "${tag_flag[@]}" --latest=false --title "Silo engine ${TAG#engine-v}" \
            --notes "Prebuilt silod for macOS (arm64) and Linux host engines (x64, arm64), built from $GITHUB_SHA. The macOS binary is not code signed: the app that embeds it sets SiloEngineCodeRequirement in the engine Info.plist and signs it. The Linux archives are not signed either. See docs/SiloUI-RELEASES.md#engine-releases."
