name: CI

# The whole check, the same script the merge gate runs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its older run; pushes to main each
# get their own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      # Offline mode checks only local files; the download is pinned to the
      # release asset digest.
      - name: Install lychee
        env:
          LYCHEE_RELEASE: lychee-v0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lychee.tar.gz" "https://github.com/lycheeverse/lychee/releases/download/$LYCHEE_RELEASE/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/lychee"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee"
          lychee=$(find "$RUNNER_TEMP/lychee" -type f -name lychee | head -n 1)
          test -x "$lychee"
          echo "LYCHEE=$lychee" >> "$GITHUB_ENV"
      - run: tools/ci/check.sh
