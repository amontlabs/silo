name: CI

# Work lands directly on main, so every push to main and every pull request
# runs the ordinary checks, including the release-tooling checks. Release
# builds, packaging and live VM checks stay in their own workflows.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its older run. Pushes to main each
# get their own group, so a merge no longer waits for the previous main run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that touch only the website, demo films, documentation or
  # frontend sources that no Rust code reads skip the native jobs below (see
  # app/SiloUI/scripts/ci-native-changes.py). A skipped job still satisfies the
  # required check. Pushes to main skip this job, and a skip or failure here
  # runs every job.
  changes:
    name: Detect native changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.native.outputs.native }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check whether Rust code can read the changed paths
        id: native
        run: |
          git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths.txt"
          python3 app/SiloUI/scripts/ci-native-changes.py < "$RUNNER_TEMP/changed-paths.txt" | tee -a "$GITHUB_OUTPUT"

  # The frontend unit suite dominates this workflow, so it runs as three
  # parallel shards. Vitest assigns every file to exactly one shard.
  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/SiloUI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=2 --shard=${{ matrix.shard }}/3

  frontend:
    name: Frontend checks and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/SiloUI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/SiloUI/package-lock.json
            website/package-lock.json
            demo/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: node scripts/preflight.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:release
      - run: python3 scripts/validate-release-version.py
      - name: Check build.rs declares every registered Tauri command
        run: python3 scripts/check-command-manifest.py
      - name: Run every release and packaging script test
        run: python3 scripts/run-script-tests.py
      - name: Run the isolation eval self-tests
        run: python3 -m unittest discover -s ../../docs/evals -p 'test_*.py'
      - name: Run the hosted reviewer service tests
        run: |
          python3 -m pip install --quiet -r ../../reviewer-service/requirements-dev.txt
          python3 -m pytest -q ../../reviewer-service
      - name: Check the website demo
        working-directory: website
        run: |
          npm ci
          npm run typecheck
          npm test -- --maxWorkers=2
      - name: Check the demo films
        working-directory: demo
        run: |
          npm ci
          npm run typecheck
          npm test

  # silo-runner is a Go program of its own (app/SiloUI/runner); it shells out to `silo` and is
  # tested against fakes, so it needs no engine, Rust or macOS.
  runner:
    name: silo-runner (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/SiloUI/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/SiloUI/runner/go.mod
          cache-dependency-path: app/SiloUI/runner/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  docs:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lychee checks links; offline mode checks only local files, so web links
      # never make CI flaky. The download is pinned to the release asset digest.
      - name: Install lychee
        env:
          LYCHEE_RELEASE: lychee-v0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lychee.tar.gz" "https://github.com/lycheeverse/lychee/releases/download/$LYCHEE_RELEASE/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/lychee"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee"
          lychee=$(find "$RUNNER_TEMP/lychee" -type f -name lychee | head -n 1)
          test -x "$lychee"
          echo "LYCHEE=$lychee" >> "$GITHUB_ENV"
      - name: Check relative links in documentation
        run: >-
          "$LYCHEE" --offline --no-progress
          '*.md' 'docs/**/*.md' 'app/SiloUI/runner/**/*.md' 'app/SiloUI/*.md' 'app/SiloUI/api/**/*.md' 'app/SiloUI/tests/**/*.md'
          'app/SiloUI/docs/**/*.html' 'app/SiloUI/src/**/*.md'
          'app/SiloUI/src-tauri/guest/**/*.md' 'app/SiloUI/src-tauri/macos-gateway/*.md' 'app/SiloUI/.changeset/*.md'
          'artifacts/**/*.md' 'website/*.md' 'demo/*.md' 'reviewer-service/*.md'

  # The engine and its daemon run on Linux hosts (Linux computers over KVM), so the
  # engine, silod, the CLI and the client crates build and pass their tests there.
  # macOS computers are stubbed on Linux and their host-only tests are gated off.
  engine-linux:
    name: Engine tests (Linux)
    needs: changes
    # Fails open: pushes skip detection, and a failed detection has an empty output.
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/SiloUI
    env:
      # Synthetic build values from the release guide, as in the macOS job.
      SILO_GITHUB_APP_SLUG: silo-ci-test
      SILO_GITHUB_CLIENT_ID: test-client
      SILO_GITHUB_CLIENT_SECRET: test-secret
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/preflight.mjs
      # silo-host's desktop feature (the app's) links GTK on Linux and its tests run with
      # it; the keyring Secret Service backend needs D-Bus. The tests also run OpenSSH and zsh.
      - name: Install Linux build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libdbus-1-dev pkg-config openssh-client zsh
      - name: Install pinned Rust toolchain
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/SiloUI
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore the pinned Git download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: silo-git-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/SiloUI/scripts/git-runtime.mjs') }}
          path: app/SiloUI/src-tauri/target/runtime-cache/dugite
      # Host-push tests drive the bundled Git; stage only that part of the
      # runtime (pinned and checksummed), not MicroSandbox.
      - name: Stage the bundled Git runtime
        run: >-
          node --input-type=module -e 'import { execFileSync } from "node:child_process";
          import { stageGitRuntime } from "./scripts/git-runtime.mjs";
          import { fetchStream } from "./scripts/build-input.mjs";
          const targetTriple = execFileSync("rustc", ["--print", "host-tuple"], { encoding: "utf8" }).trim();
          await stageGitRuntime({ appRoot: process.cwd(), targetTriple, fetchStream })'
      # nextest runs each test in its own process, so tests that serialize on
      # process-wide state in one libtest binary run in parallel. The download is
      # pinned to the release asset digest.
      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.149
          NEXTEST_ASSET: x86_64-unknown-linux-gnu
          NEXTEST_SHA256: 32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nextest.tar.gz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-$NEXTEST_ASSET.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 --check --strict -
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$(dirname "$(command -v cargo)")"
          cargo nextest --version
      - name: Run engine tests
        timeout-minutes: 30
        run: cargo nextest run -p silo-engine --locked --profile ci
      # The headless daemon must not need GTK: silo-host's desktop feature stays off.
      - name: Check that silod does not depend on GTK
        run: |
          if cargo tree -p silod -e normal --locked --prefix none | grep -E '^(gtk|gdk|gio|glib|webkit2gtk)(-sys)? v'; then
            echo "silod depends on the GTK stack" >&2
            exit 1
          fi
      # One run for the daemon side, so silo-host builds without its desktop feature as in
      # silod; silo-host's own tests run with its default (desktop) feature, then without.
      - name: Run daemon, CLI and client tests
        timeout-minutes: 30
        run: cargo nextest run -p silod -p silo-cli -p silo-client -p silo-api -p silo-container-shim --locked --profile ci
      - name: Run host helper tests
        timeout-minutes: 15
        run: |
          cargo nextest run -p silo-host --locked --profile ci
          cargo nextest run -p silo-host --no-default-features --locked --profile ci

  rust:
    name: Rust tests
    needs: changes
    # Fails open: pushes skip detection, and a failed detection has an empty output.
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/SiloUI
    env:
      # Synthetic build values from the release guide: these tests never sign in
      # to a GitHub account, and the test executables are never distributed.
      SILO_GITHUB_APP_SLUG: silo-ci-test
      SILO_GITHUB_CLIENT_ID: test-client
      SILO_GITHUB_CLIENT_SECRET: test-secret
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/preflight.mjs
      - name: Install shell test dependency
        run: brew install fish
      - name: Install pinned Rust toolchain
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal --component rustfmt
          rustup default "$runtime_toolchain"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the hosted reviewer service dependencies
        run: python3 -m pip install --quiet -r ../../reviewer-service/requirements.txt
      - name: Test macOS release signing with disposable fixtures
        run: python3 -m unittest discover -s scripts -p 'test_macos_release.py'
      - name: Check Rust formatting
        run: cargo fmt --check -p silo-api -p silo-cli -p silo-client -p silo-host -p silo-container-shim -p silo-ui -p silo-engine -p silod
      # The Cargo workspace root is app/SiloUI, so its build output is
      # app/SiloUI/target; src-tauri/target holds only the runtime cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/SiloUI
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Runtime preparation uses only Node built-ins, so this job needs no npm ci.
      # Restores the patched MicroSandbox build that warm-release-caches.yml
      # saves from main, instead of compiling it on every run.
      - name: Prepare native resources
        timeout-minutes: 30
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: macos-15
          target: aarch64-apple-darwin
      # nextest runs each test in its own process, so tests that serialize on
      # process-wide state in one libtest binary run in parallel. The download is
      # pinned to the release asset digest.
      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.149
          NEXTEST_ASSET: universal-apple-darwin
          NEXTEST_SHA256: 47b9941765a9ff94e304a3fe5444ac1c7593da655525b8b69f8f2b31a9217507
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nextest.tar.gz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-$NEXTEST_ASSET.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 --check --strict -
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$(dirname "$(command -v cargo)")"
          cargo nextest --version
      # The workspace has no doctests, which nextest does not run.
      - name: Run Rust tests
        timeout-minutes: 30
        env:
          # The CLI's end-to-end test of the reviewer service fails instead of skipping.
          SILO_REVIEWER_E2E_REQUIRED: '1'
        run: cargo nextest run --manifest-path Cargo.toml --workspace --locked --profile ci
      - name: Test patched updater transport and atomic installation
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -p tauri-plugin-updater --lib
