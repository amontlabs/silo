name: Publish Silo system updates
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish verified Silo draft]
    types: [completed]
  schedule:
    # Refresh the signed metadata before its 14-day expiry, even without releases.
    - cron: '17 6 * * 1'
concurrency:
  group: silo-apt-repository
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment:
      name: apt-publish
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Read GitHub's signed release attestations for each downloaded package.
      attestations: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gnupg dpkg-dev
      - name: Test signed repository generation
        run: python3 -m unittest discover -s app/SiloUI/scripts -p 'test_apt_repository.py'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Download verified public packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 app/SiloUI/scripts/download-apt-releases.py apt-packages
      - name: Sign update repository
        env:
          SILO_APT_SIGNING_KEY: ${{ secrets.SILO_APT_SIGNING_KEY }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -eu
          test -n "$SILO_APT_SIGNING_KEY"
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$SILO_APT_SIGNING_KEY" | gpg --batch --import
          python3 app/SiloUI/scripts/apt-repository.py --packages apt-packages --output apt-site --previous-url "${PAGES_URL%/}/apt" --fingerprint "$(cat app/SiloUI/scripts/debian/signing-fingerprint.txt)"
      - name: Reject stale publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          packaged_version=$(cat apt-packages/latest-version)
          latest_version=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          test "$packaged_version" = "$latest_version"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apt-site
      - name: Publish system updates
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
