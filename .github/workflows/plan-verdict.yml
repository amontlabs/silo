name: Plan verdict

# The owner's verdict, a label on an entry's issue, to plan/ on main as a commit, then sync so the
# verdict shows in the issue's history. The commit is pushed with this workflow's own token, which
# starts no other workflow, so sync runs here. Not verified until the owner has created the App and
# set its two secrets.
on:
  issues:
    types: [labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verdict:
    name: Verdict
    # Only a verdict label; the label's name is never put in a script.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'verdict:')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # One group with plan-sync, on the job so that a skipped job never enters it.
    concurrency:
      group: plan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: plan pull --commit
        env:
          WORKSHOP_APP_ID: ${{ secrets.WORKSHOP_APP_ID }}
          WORKSHOP_PRIVATE_KEY: ${{ secrets.WORKSHOP_PRIVATE_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: tools/plan/bin/plan pull --commit
      - name: Push to main
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: tools/plan/bin/push-main
      - name: plan sync
        env:
          WORKSHOP_APP_ID: ${{ secrets.WORKSHOP_APP_ID }}
          WORKSHOP_PRIVATE_KEY: ${{ secrets.WORKSHOP_PRIVATE_KEY }}
        run: tools/plan/bin/plan sync
