name: Publish verified Silo draft
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version of the reviewed draft, for example 0.1.0
        required: true
        type: string
      allow_stable:
        description: Owner-approved publication of version 1.0.0 or later
        type: boolean
        default: false
      allow_unnotarized:
        description: Owner-approved publication of an ad hoc signed draft after a notarized release
        type: boolean
        default: false
concurrency:
  group: silo-release-publish
  queue: max
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    environment: release-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y minisign squashfs-tools
      - name: Verify and publish existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
          ALLOW_STABLE: ${{ inputs.allow_stable }}
          ALLOW_UNNOTARIZED: ${{ inputs.allow_unnotarized }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = "refs/tags/v$RELEASE_VERSION"
          set --
          if [[ "$ALLOW_STABLE" == true ]]; then
            set -- --allow-stable
          fi
          if [[ "${ALLOW_UNNOTARIZED:-}" == true ]]; then
            set -- "$@" --allow-unnotarized
          fi
          python3 app/SiloUI/scripts/publish-release.py "$RELEASE_VERSION" --publish "$@"

      # Refresh amontlabs.com now rather than on its next scheduled run. Never fails the release.
      - name: Refresh amontlabs.com
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::No SITE_DISPATCH_TOKEN; amontlabs.com refreshes on its schedule"; exit 0; fi
          gh api repos/amontlabs/amontlabs.com/dispatches -f event_type=release
