name: Linux host

# Runs a real Linux computer on a Linux host engine: builds the Silo Dev engine
# archive (package-engine.py), unpacks it, registers it as a systemd user
# service and drives a computer through its silo command
# (scripts/linux-host-e2e.sh): create, start, exec, checkpoint, fork, exec in
# the fork, drop both. Then two accounts act as two devices (scripts/hosts-e2e.sh):
# one prepared with `silo host init`, the other adding it by address over the local
# SSH server and managing a computer on it. GitHub's ubuntu-24.04 runners have
# /dev/kvm. Build values are synthetic; this workflow gets no secrets and never
# signs in to GitHub.
#
# The `forks` job runs docs/forks-ci/checks/measure_forks.sh on the same engine and uploads its
# evidence as an artifact. It runs only on a manual run and on pull requests that change
# docs/forks-ci/checks/**, never on ordinary pull requests or pushes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/SiloUI/**'
      - '!app/SiloUI/**/*.md'
      - '!app/SiloUI/.changeset/**'
      - '!app/SiloUI/docs/**'
      # Frontend sources, except the ones that Rust tests read (scripts/ci-native-changes.py).
      - '!app/SiloUI/src/**'
      - 'app/SiloUI/src/test/contracts/**'
      - 'app/SiloUI/src/features/application/model/reserved-secret-names.json'
      - 'app/SiloUI/src/features/computers/model/container-unavailable.json'
      - '.github/actions/prepare-release-runtime/**'
      - '.github/workflows/linux-host.yml'
      # The fork measurements (job `forks`); the other job runs on these pull requests too.
      - 'docs/forks-ci/checks/**'

permissions:
  contents: read

concurrency:
  group: linux-host-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  computer:
    name: Linux computer on KVM
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: app/SiloUI
    env:
      # Synthetic build values from the release guide, as in ci.yml.
      SILO_GITHUB_APP_SLUG: silo-ci-test
      SILO_GITHUB_CLIENT_ID: test-client
      SILO_GITHUB_CLIENT_SECRET: test-secret
      CARGO_INCREMENTAL: '0'
      UNIT: org.silo.dev.engine.service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # GitHub's documented way to give the runner account KVM on hosted Linux runners.
      # The user manager's processes are not in the kvm group, so the device is opened up.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same probe as scripts/test-linux-runtime.py: the KVM API answers and a VM handle
      # can be created. A runner without usable KVM fails here instead of passing.
      - name: Probe KVM
        run: |
          ls -l /dev/kvm
          python3 - <<'PY'
          import fcntl, os
          with open('/dev/kvm', 'rb+', buffering=0) as device:
              assert fcntl.ioctl(device, 0xAE00, 0) == 12, 'unsupported KVM API version'
              os.close(fcntl.ioctl(device, 0xAE01, 0))
          print('KVM API 12; a VM handle was created')
          PY
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev libcap-ng-dev libdbus-1-dev cmake
      - name: Install pinned Rust toolchain
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
      # Restores the runtime caches main populates; a miss builds MicroSandbox here.
      - name: Prepare the runtime
        timeout-minutes: 45
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
      # silo-runner is a Go program of its own and goes in the archive (runner/go.mod pins Go).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/SiloUI/runner/go.mod
          cache-dependency-path: app/SiloUI/runner/go.sum
      - name: Build and package the Dev engine
        timeout-minutes: 40
        run: python3 scripts/package-engine.py --platform linux-x64 --channel development --out-dir "$RUNNER_TEMP/engine-release" --source-commit "$GITHUB_SHA"
      - name: Install the engine from its archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/engine-release"
          sha256sum -c ./*.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/prefix"
          tar -xzf ./*.tar.gz -C "$RUNNER_TEMP/prefix"
          engine="$RUNNER_TEMP/prefix/silo-engine"
          # silod refuses an engine directory that others can write to; the runner's umask
          # or temp directory may leave it group-writable.
          chmod -R go-w "$RUNNER_TEMP/prefix"
          test "$("$engine/silo" --print-channel-identifier)" = org.silo.dev
          echo "ENGINE=$engine" >> "$GITHUB_ENV"
      # Lingering starts the runner account's systemd user manager without a login session,
      # as on a headless host whose owner turned it on.
      - name: Start the engine as a systemd user service
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          for _ in $(seq 30); do
            systemctl --user show-environment >/dev/null 2>&1 && break
            sleep 1
          done
          systemctl --user show-environment >/dev/null
          "$ENGINE/silod" --service register | tee "$RUNNER_TEMP/service-status.txt"
          python3 - "$RUNNER_TEMP/service-status.txt" <<'PY'
          import sys
          lines = open(sys.argv[1]).read().splitlines()
          assert lines[0] == 'enabled', lines
          assert 'state: active' in lines, lines
          assert 'program: this silod' in lines, lines
          assert 'linger: yes' in lines, lines
          PY
      # silo-runner from the archive, against the running engine and the real systemd user manager. It
      # never contacts GitHub (registering runners needs an admin token, which this workflow does not
      # hold), so no job runs; the unit, KVM check, budget and journal are what is checked.
      - name: Run silo-runner as a service next to the engine
        timeout-minutes: 5
        run: bash scripts/runner-host-e2e.sh "$ENGINE" "$UNIT"
      # What a container computer needs from the host (`silo host init` names the same things):
      # sudo only installs the packages and relaxes Ubuntu's host-wide guard on unprivileged user
      # namespaces; Silo itself sets nothing. The runner account's sub-ids come from adduser.
      - name: Prepare the host for container computers
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends crun skopeo umoci uidmap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          grep "^$(id -un):" /etc/subuid /etc/subgid || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          ls -l /dev/net/tun
      - name: Drive a Linux computer and a container computer through the silo command
        timeout-minutes: 60
        env:
          SILO_E2E_CONTAINER: '1'
          # The desktop checks leave a screenshot of the desktop and of Chrome here.
          SILO_E2E_ARTIFACTS: ${{ runner.temp }}/desktop-evidence
        run: bash scripts/linux-host-e2e.sh "$ENGINE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-desktop-screenshots
          path: ${{ runner.temp }}/desktop-evidence/
          if-no-files-found: ignore
          retention-days: 14
      # SIGTERM ends the engine's session; it must exit 0 so systemd does not restart it.
      # A session end that left computers running exits non-zero, and fails here. After an
      # earlier failure the step only stops the engine, leaving the unit for the logs below.
      - name: Stop the engine and remove the service
        if: always() && env.ENGINE != ''
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" != success ]]; then
            systemctl --user stop "$UNIT" || true
            exit 0
          fi
          systemctl --user stop "$UNIT"
          result=$(systemctl --user show "$UNIT" --property=Result --value)
          status=$(systemctl --user show "$UNIT" --property=ExecMainStatus --value)
          echo "Result=$result ExecMainStatus=$status"
          test "$result" = success
          test "$status" = 0
          test ! -e "$HOME/.silo-dev/engine.sock"
          "$ENGINE/silod" --service unregister | tee "$RUNNER_TEMP/service-status.txt"
          test "$(head -n 1 "$RUNNER_TEMP/service-status.txt")" = notRegistered
          test ! -e "$HOME/.config/systemd/user/$UNIT"
      # Two devices on this machine: silo-host is prepared with `silo host init`, and
      # silo-controller runs its own engine and adds the host over the local SSH server.
      # The engine is copied to a root-owned directory, which both accounts may run. Its
      # parent is root's and 0755: the runner's /opt is world-writable, which silod refuses.
      - name: Prepare a host and a controller account
        run: |
          set -euo pipefail
          sudo install -d -o root -g root -m 0755 /var/lib/silo-ci
          sudo cp -a "$ENGINE" /var/lib/silo-ci/silo-engine
          sudo chown -R root:root /var/lib/silo-ci/silo-engine
          sudo chmod -R go-w /var/lib/silo-ci/silo-engine
          sudo ssh-keygen -A
          sudo systemctl start ssh
          for account in silo-host silo-controller; do
            sudo useradd --create-home --shell /bin/bash "$account"
            # No password, but not locked: sshd still accepts the account's keys.
            sudo usermod --password '*' "$account"
            sudo loginctl enable-linger "$account"
          done
          for account in silo-host silo-controller; do
            bus="/run/user/$(id -u "$account")/bus"
            for _ in $(seq 30); do
              sudo test -S "$bus" && break
              sleep 1
            done
            sudo test -S "$bus"
          done
          echo "HOSTS_E2E=1" >> "$GITHUB_ENV"
      - name: Manage a computer on another device
        timeout-minutes: 40
        env:
          SILO_E2E_REMOTE_EXEC: '1'
          SILO_E2E_SHARE: '1'
        run: bash scripts/hosts-e2e.sh /var/lib/silo-ci/silo-engine silo-host silo-controller
      - name: Stop both accounts' engines
        if: always() && env.HOSTS_E2E == '1'
        run: |
          for account in silo-host silo-controller; do
            uid=$(id -u "$account")
            sudo -u "$account" env -i HOME="$(getent passwd "$account" | cut -d: -f6)" PATH=/usr/bin:/bin XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
              /var/lib/silo-ci/silo-engine/silod --service unregister || true
          done
      - name: Collect logs
        if: failure()
        run: |
          logs="$RUNNER_TEMP/linux-host-logs"
          mkdir -p "$logs"
          systemctl --user status "$UNIT" --no-pager > "$logs/service-status.txt" 2>&1 || true
          journalctl --user --unit "$UNIT" --no-pager > "$logs/engine-journal.txt" 2>&1 || true
          cp -r "$HOME/.local/state/org.silo.dev/logs" "$logs/engine-logs" 2>/dev/null || true
          find "$HOME/.local/share/org.silo.dev" -name '*.log' -size -20M -exec cp --parents {} "$logs" \; 2>/dev/null || true
          "$ENGINE/silo" --json list --all > "$logs/computers.json" 2>&1 || true
          ls -l /dev/kvm > "$logs/kvm.txt" 2>&1 || true
          df -h > "$logs/disk.txt" 2>&1 || true
          for account in silo-host silo-controller; do
            id -u "$account" >/dev/null 2>&1 || continue
            sudo journalctl _UID="$(id -u "$account")" --no-pager > "$logs/$account-journal.txt" 2>&1 || true
          done
          sudo journalctl --unit ssh --no-pager > "$logs/sshd-journal.txt" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-host-logs
          path: ${{ runner.temp }}/linux-host-logs/
          if-no-files-found: warn
          retention-days: 7

  # The gateway (silo-macos-gateway, which also runs a container computer's network) on Linux: its own
  # tests, then a live check with no root step in the path (scripts/gateway-live-check.py). An
  # unprivileged user makes a user and network namespace with `unshare`, creates a TAP in it and hands
  # the descriptor to the gateway, once driven by the script and once started by the engine's own code.
  # sudo only installs packages and relaxes Ubuntu's host-wide guard on unprivileged user namespaces
  # (kernel.apparmor_restrict_unprivileged_userns); CT2 adds that prerequisite to `silo host init`.
  # The secret is a fake value.
  gateway:
    name: Gateway as a container's network
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app/SiloUI
    env:
      SILO_GITHUB_APP_SLUG: silo-ci-test
      SILO_GITHUB_CLIENT_ID: test-client
      SILO_GITHUB_CLIENT_SECRET: test-secret
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev libcap-ng-dev libdbus-1-dev cmake curl iproute2 util-linux
      - name: Install pinned Rust toolchain
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
      - name: Prepare the runtime
        timeout-minutes: 45
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
      - name: Test the gateway crate
        timeout-minutes: 30
        run: node scripts/test-gateway.mjs
      - name: Test the live check's own helpers
        run: python3 -m unittest discover -s scripts -p 'test_gateway_live_check.py'
      - name: Build the engine harness
        timeout-minutes: 40
        run: cargo build --locked --manifest-path Cargo.toml -p silo-engine --example gateway_tap_harness
      - name: Allow unprivileged user namespaces
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          ls -l /dev/net/tun
          id
      - name: Live check, driven by the script
        run: |
          python3 scripts/gateway-live-check.py \
            --gateway "$PWD/src-tauri/binaries/silo-macos-gateway-x86_64-unknown-linux-gnu" \
            --evidence-dir "$RUNNER_TEMP/gateway-evidence/script"
      - name: Live check, gateway started by the engine
        run: |
          python3 scripts/gateway-live-check.py \
            --gateway "$PWD/src-tauri/binaries/silo-macos-gateway-x86_64-unknown-linux-gnu" \
            --harness "$PWD/target/debug/examples/gateway_tap_harness" \
            --evidence-dir "$RUNNER_TEMP/gateway-evidence/engine"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gateway-live-check
          path: ${{ runner.temp }}/gateway-evidence/
          if-no-files-found: warn
          retention-days: 14

  # Whether the fork measurements run: always on a manual run; on a pull request only when it changes
  # docs/forks-ci/checks/**. The workflow's path filter also starts this workflow for Rust changes, which
  # must not pay for the measurements.
  forks-changes:
    name: Fork measurements wanted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -q '^docs/forks-ci/checks/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  forks:
    name: Fork measurements on KVM
    needs: forks-changes
    if: needs.forks-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app/SiloUI
    env:
      SILO_GITHUB_APP_SLUG: silo-ci-test
      SILO_GITHUB_CLIENT_ID: test-client
      SILO_GITHUB_CLIENT_SECRET: test-secret
      CARGO_INCREMENTAL: '0'
      UNIT: org.silo.dev.engine.service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # GitHub's documented way to give the runner account KVM on hosted Linux runners.
      # The user manager's processes are not in the kvm group, so the device is opened up.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same probe as scripts/test-linux-runtime.py: the KVM API answers and a VM handle
      # can be created. A runner without usable KVM fails here instead of passing.
      - name: Probe KVM
        run: |
          ls -l /dev/kvm
          python3 - <<'PY'
          import fcntl, os
          with open('/dev/kvm', 'rb+', buffering=0) as device:
              assert fcntl.ioctl(device, 0xAE00, 0) == 12, 'unsupported KVM API version'
              os.close(fcntl.ioctl(device, 0xAE01, 0))
          print('KVM API 12; a VM handle was created')
          PY
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev libcap-ng-dev libdbus-1-dev cmake
      - name: Install pinned Rust toolchain
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
      # Restores the runtime caches main populates; a miss builds MicroSandbox here.
      - name: Prepare the runtime
        timeout-minutes: 45
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
      # silo-runner is a Go program of its own and goes in the archive (runner/go.mod pins Go).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/SiloUI/runner/go.mod
          cache-dependency-path: app/SiloUI/runner/go.sum
      - name: Build and package the Dev engine
        timeout-minutes: 40
        run: python3 scripts/package-engine.py --platform linux-x64 --channel development --out-dir "$RUNNER_TEMP/engine-release" --source-commit "$GITHUB_SHA"
      - name: Install the engine from its archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/engine-release"
          sha256sum -c ./*.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/prefix"
          tar -xzf ./*.tar.gz -C "$RUNNER_TEMP/prefix"
          engine="$RUNNER_TEMP/prefix/silo-engine"
          # silod refuses an engine directory that others can write to; the runner's umask
          # or temp directory may leave it group-writable.
          chmod -R go-w "$RUNNER_TEMP/prefix"
          test "$("$engine/silo" --print-channel-identifier)" = org.silo.dev
          echo "ENGINE=$engine" >> "$GITHUB_ENV"
      # Lingering starts the runner account's systemd user manager without a login session,
      # as on a headless host whose owner turned it on.
      - name: Start the engine as a systemd user service
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          for _ in $(seq 30); do
            systemctl --user show-environment >/dev/null 2>&1 && break
            sleep 1
          done
          systemctl --user show-environment >/dev/null
          "$ENGINE/silod" --service register | tee "$RUNNER_TEMP/service-status.txt"
          python3 - "$RUNNER_TEMP/service-status.txt" <<'PY'
          import sys
          lines = open(sys.argv[1]).read().splitlines()
          assert lines[0] == 'enabled', lines
          assert 'state: active' in lines, lines
          assert 'program: this silod' in lines, lines
          assert 'linger: yes' in lines, lines
          PY
      # Measurements (a)-(d) and (f) of docs/forks-ci/PLAN.md phase F1. (f) runs only if the runner's
      # free memory covers ten forks; otherwise the evidence says why it did not.
      - name: Measure forks
        timeout-minutes: 90
        working-directory: ${{ github.workspace }}
        env:
          SILO: ${{ env.ENGINE }}/silo
          MACHINE: github-ubuntu-24.04-kvm
          OUT: ${{ runner.temp }}/forks-evidence
        run: bash docs/forks-ci/checks/measure_forks.sh 2>&1 | tee "$RUNNER_TEMP/measure-forks.log"
      - name: Stop the engine
        if: always() && env.ENGINE != ''
        run: systemctl --user stop "$UNIT" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: forks-f1-evidence
          path: |
            ${{ runner.temp }}/forks-evidence/
            ${{ runner.temp }}/measure-forks.log
          if-no-files-found: warn
          retention-days: 30
