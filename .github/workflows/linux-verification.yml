name: Linux verification

# Unit tests and lint run in ci.yml. This workflow builds the development app
# and drives it through native WebKit; the AMD64 job also runs live VM tests
# on main, nightly and manual runs.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main, 'verify-linux-*']
    paths:
      - 'app/SiloUI/**'
      - '!app/SiloUI/**/*.md'
      - '!app/SiloUI/.changeset/**'
      - '!app/SiloUI/docs/**'
      - '.github/actions/prepare-release-runtime/**'
      - '.github/workflows/linux-verification.yml'
  pull_request:
    paths:
      - 'app/SiloUI/**'
      - '!app/SiloUI/**/*.md'
      - '!app/SiloUI/.changeset/**'
      - '!app/SiloUI/docs/**'
      - '.github/actions/prepare-release-runtime/**'
      - '.github/workflows/linux-verification.yml'

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app/SiloUI
    env:
      # Synthetic build values: these tests never sign in to a GitHub account.
      SILO_GITHUB_APP_SLUG: silo-linux-test
      SILO_GITHUB_CLIENT_ID: test-client
      SILO_GITHUB_CLIENT_SECRET: test-secret
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - run: node scripts/preflight.mjs
      - name: Install Linux build and desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libclang-dev libcap-ng-dev cmake webkit2gtk-driver xvfb xauth dbus-x11 python3-selenium gstreamer1.0-libav fish
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/SiloUI/src-tauri
      - run: npm ci
      # Restores the patched MicroSandbox build that warm-release-caches.yml
      # saves from main, instead of compiling it on every run.
      - name: Prepare native resources
        timeout-minutes: 30
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ matrix.runner }}
          target: ${{ runner.arch == 'ARM64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
      - name: Build development Linux application
        timeout-minutes: 20
        run: npm run desktop:build -- --debug --no-bundle --ci
      - name: Install external WebDriver
        timeout-minutes: 10
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Verify native WebKit onboarding and validation
        timeout-minutes: 10
        env:
          SILO_LINUX_APPLICATION_ID: org.silo.dev
        run: xvfb-run -a dbus-run-session -- python3 scripts/test-linux-desktop.py
      - name: Verify real AMD64 hardware runtime operations
        if: matrix.runner == 'ubuntu-24.04' && github.event_name != 'pull_request'
        timeout-minutes: 55
        run: |
          if test -e /dev/kvm; then
            sudo -n runuser -u "$(id -un)" -g kvm -- env PATH="$PATH" SILO_GITHUB_APP_SLUG="$SILO_GITHUB_APP_SLUG" SILO_GITHUB_CLIENT_ID="$SILO_GITHUB_CLIENT_ID" SILO_GITHUB_CLIENT_SECRET="$SILO_GITHUB_CLIENT_SECRET" CARGO_PROFILE_DEV_DEBUG="$CARGO_PROFILE_DEV_DEBUG" CARGO_PROFILE_TEST_DEBUG="$CARGO_PROFILE_TEST_DEBUG" CARGO_INCREMENTAL="$CARGO_INCREMENTAL" python3 scripts/test-linux-runtime.py
          else
            python3 scripts/test-linux-runtime.py
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-evidence-${{ matrix.runner }}
          path: app/SiloUI/test-results/linux/
          if-no-files-found: warn
          retention-days: 7
