version: 2
updates:
  # Workflows pin every action to a commit SHA with a version comment; Dependabot
  # proposes new SHAs and updates the comments. Grouped to one weekly pull request.
  - package-ecosystem: github-actions
    directories:
      - '/'
      - '/.github/actions/prepare-release-runtime'
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
  # npm and Cargo version updates arrive in two weekly grouped pull requests per
  # ecosystem: minor and patch, and major (Dependabot counts a 0.x minor bump such
  # as sha2 0.10 -> 0.11 as major). Majors stay apart so a breaking upgrade cannot
  # hold back routine bumps; one that needs porting can be split out with an
  # ignore rule. Security fixes arrive as advisories appear, grouped into one pull
  # request per ecosystem. Tauri stays on manual minor
  # upgrades because its CLI rejects JS and Rust packages on different minors.
  # The artifacts/ film projects and src-tauri/macos-gateway are left out on
  # purpose: they are pinned to the recordings and the bundled runtime.
  - package-ecosystem: npm
    directories:
      - '/app/SiloUI'
      - '/website'
      - '/demo'
    schedule:
      interval: weekly
    groups:
      npm:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-major:
        applies-to: version-updates
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      - dependency-name: '@tauri-apps/*'
        update-types: [version-update:semver-minor, version-update:semver-major]
      # THIRD-PARTY-NOTICES.md names the bundled noVNC release as its MPL-2.0 source.
      - dependency-name: '@novnc/novnc'
  - package-ecosystem: cargo
    directory: '/app/SiloUI'
    schedule:
      interval: weekly
    groups:
      cargo:
        applies-to: version-updates
        update-types: [minor, patch]
      cargo-major:
        applies-to: version-updates
        update-types: [major]
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      - dependency-name: 'tauri*'
        update-types: [version-update:semver-minor, version-update:semver-major]
      # Pinned to the vendored, Silo-patched copy under src-tauri/vendor.
      - dependency-name: 'tauri-plugin-updater'
      # Must match runtime-inputs.json and the microsandbox patch set.
      - dependency-name: 'microsandbox-*'
