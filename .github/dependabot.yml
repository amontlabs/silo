version: 2
updates:
  # Workflows pin every action to a commit SHA with a version comment; Dependabot
  # proposes new SHAs and updates the comments. Grouped to one weekly pull request.
  - package-ecosystem: github-actions
    directories:
      - '/'
      - '/.github/actions/prepare-release-runtime'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  # npm and Cargo updates are grouped to one weekly pull request per ecosystem;
  # security updates still open on their own.
  - package-ecosystem: npm
    directories:
      - '/app/SiloUI'
      - '/website'
      - '/demo'
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: '/app/SiloUI'
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
