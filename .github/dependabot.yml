version: 2
updates:
  # Workflows pin every action to a commit SHA with a version comment; Dependabot
  # proposes new SHAs and updates the comments. Grouped to one weekly pull request.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
  # npm version updates arrive in two weekly grouped pull requests: minor and
  # patch, and major. Security fixes arrive as advisories appear, grouped into
  # one pull request.
  - package-ecosystem: npm
    directory: '/website'
    schedule:
      interval: weekly
    groups:
      npm:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-major:
        applies-to: version-updates
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
