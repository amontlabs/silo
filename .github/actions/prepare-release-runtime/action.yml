name: Prepare cached release runtime
description: Restore verified public runtime inputs; only main can populate shared caches.
inputs:
  runner:
    description: Pinned runner image label
    required: true
  target:
    description: Rust target triple
    required: true
  save:
    description: Populate default-branch caches from the credential-free warmer (Cargo downloads, and the runtime on manual dispatch; a push to main saves the runtime without it)
    default: 'false'
  lookup-only:
    description: Check exact public-cache availability without restoring or preparing
    default: 'false'
  artifact-name:
    description: Same-run public runtime cache produced on an exact cache miss
    default: ''
  artifact-sha256:
    description: Expected archive SHA256 from the producing job
    default: ''
outputs:
  cache-hit:
    description: Whether the exact reviewed public runtime cache exists
    value: ${{ steps.runtime.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Validate approved runtime inputs before cache or network work
      id: runtime-inputs
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        node app/SiloUI/scripts/preflight.mjs
        echo "toolchain=$(node -p "require('./app/SiloUI/runtime-inputs.json').toolchain")" >> "$GITHUB_OUTPUT"
    - name: Install Go for the pinned guest LFS transfer server
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.x'
        cache: false
    - name: Identify Go before public cache lookup
      id: go-compiler
      shell: bash
      env:
        GOTOOLCHAIN: local
      run: |
        go_version=$(go env GOVERSION)
        echo "version=${go_version#go}" >> "$GITHUB_OUTPUT"
    # The compiled MicroSandbox key includes the Apple SDK, the C tools, cargo configuration and
    # build environment of this runner (readBuildToolIdentity). Their digest is part of this cache
    # key too, so a runner image update misses, rebuilds once and saves under the new key. So is
    # the runtime cache format (RUNTIME_CACHE_FORMAT in scripts/build-input.mjs), which the
    # compiled build keys also include.
    - name: Identify build tools before public cache lookup
      id: build-tools
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GOTOOLCHAIN: local
        RUNTIME_TARGET: ${{ inputs.target }}
      run: node app/SiloUI/scripts/runtime-cache-entries.mjs tools --target "$RUNTIME_TARGET" >> "$GITHUB_OUTPUT"
    - name: Restore public runtime cache
      if: inputs.lookup-only == 'true' || inputs.artifact-name == ''
      id: runtime
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        lookup-only: ${{ inputs.lookup-only }}
        key: silo-runtime-v1-${{ inputs.runner }}-${{ inputs.target }}-rust${{ steps.runtime-inputs.outputs.toolchain }}-go${{ steps.go-compiler.outputs.version }}-tools${{ steps.build-tools.outputs.digest }}-format${{ steps.build-tools.outputs.format }}-${{ hashFiles('.github/actions/prepare-release-runtime/action.yml', 'app/SiloUI/runtime-inputs.json', 'app/SiloUI/scripts/preflight.mjs', 'app/SiloUI/scripts/prepare-microsandbox-runtime.mjs', 'app/SiloUI/scripts/microsandbox-runtime.mjs', 'app/SiloUI/scripts/build-input.mjs', 'app/SiloUI/scripts/runtime-cache-entries.mjs', 'app/SiloUI/scripts/git-runtime.mjs', 'app/SiloUI/scripts/lfs-transfer-runtime.mjs', 'app/SiloUI/patches/microsandbox-*.patch', 'app/SiloUI/src-tauri/macos-gateway/**') }}
        # The macOS gateway sources are part of the patched MicroSandbox build
        # key (readMacosGatewayInputs hashes the whole crate), so they must change this key too.
        # Older cache archives are input candidates only; preparation below
        # rechecks pinned bytes and the source/patch/toolchain build key.
        restore-keys: silo-runtime-v1-${{ inputs.runner }}-${{ inputs.target }}-rust${{ steps.runtime-inputs.outputs.toolchain }}-
        path: |
          app/SiloUI/src-tauri/target/runtime-cache/v*/msb-*
          app/SiloUI/src-tauri/target/runtime-cache/v*/microsandbox-*.tar.gz
          app/SiloUI/src-tauri/target/runtime-cache/v*/agentd-*
          app/SiloUI/src-tauri/target/runtime-cache/v*/licenses
          app/SiloUI/src-tauri/target/runtime-cache/v*/libkrunfw-*
          app/SiloUI/src-tauri/target/runtime-cache/v*/patched-builds/*/published/manifest.json
          app/SiloUI/src-tauri/target/runtime-cache/v*/patched-builds/*/published/msb
          app/SiloUI/src-tauri/target/runtime-cache/v*/patched-builds/*/published/silo-macos-gateway
          app/SiloUI/src-tauri/target/runtime-cache/dugite
          app/SiloUI/src-tauri/target/runtime-cache/git-lfs-transfer/*/source.tar.gz
          app/SiloUI/src-tauri/target/runtime-cache/git-lfs-transfer/*/builds
    - name: Report public runtime cache status
      shell: bash
      env:
        EXACT_HIT: ${{ steps.runtime.outputs.cache-hit }}
        LOOKUP_ONLY: ${{ inputs.lookup-only }}
        RUNTIME_TARGET: ${{ inputs.target }}
        SHARED_ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        if [[ -n "$SHARED_ARTIFACT" && "$LOOKUP_ONLY" != true ]]; then
          echo "Runtime cache $RUNTIME_TARGET: consume this platform's verified same-run artifact."
        elif [[ "$EXACT_HIT" == true ]]; then
          echo "Runtime cache $RUNTIME_TARGET: exact hit (lookup-only=$LOOKUP_ONLY)."
        else
          echo "Runtime cache $RUNTIME_TARGET: exact miss (lookup-only=$LOOKUP_ONLY)."
        fi
    - name: Restore Cargo downloads
      if: inputs.lookup-only != 'true'
      id: cargo
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        restore-keys: silo-cargo-downloads-v1-${{ inputs.runner }}-${{ inputs.target }}-
        key: silo-cargo-downloads-v1-${{ inputs.runner }}-${{ inputs.target }}-${{ hashFiles('app/SiloUI/Cargo.lock', 'app/SiloUI/scripts/microsandbox-runtime.mjs', 'app/SiloUI/patches/microsandbox-*.patch') }}
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
    - name: Download same-run public runtime inputs
      if: inputs.lookup-only != 'true' && inputs.artifact-name != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/shared-runtime
    - name: Check and import public runtime cache archive
      if: inputs.lookup-only != 'true' && inputs.artifact-name != ''
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        RUNTIME_ARCHIVE_SHA256: ${{ inputs.artifact-sha256 }}
      run: python3 app/SiloUI/scripts/release-runtime-cache.py unpack --archive "$RUNNER_TEMP/shared-runtime/runtime-cache.tar.gz" --sha256 "$RUNTIME_ARCHIVE_SHA256"
    # The Linux `silo` that Silo installs in its Linux computers is built with Zig as its C
    # compiler (scripts/guest-silo-runtime.mjs; ZIG_VERSION there is this version). The download
    # is pinned to the release digest listed in https://ziglang.org/download/index.json.
    - name: Install Zig for the Linux program of Silo's tools
      if: inputs.lookup-only != 'true'
      shell: bash
      env:
        ZIG_VERSION: 0.15.2
        RUNTIME_TARGET: ${{ inputs.target }}
      run: |
        case "$RUNTIME_TARGET" in
          aarch64-apple-darwin) ZIG_ASSET=aarch64-macos; ZIG_SHA256=3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b ;;
          x86_64-unknown-linux-gnu) ZIG_ASSET=x86_64-linux; ZIG_SHA256=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239 ;;
          aarch64-unknown-linux-gnu) ZIG_ASSET=aarch64-linux; ZIG_SHA256=958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f ;;
          *) echo "No pinned Zig for $RUNTIME_TARGET" >&2; exit 1 ;;
        esac
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-$ZIG_ASSET-$ZIG_VERSION.tar.xz"
        echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 --check --strict -
        mkdir -p "$RUNNER_TEMP/zig"
        tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/zig"
        echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/zig/zig" version
    # Always verify and re-stage cached inputs, and regenerate release-info.json.
    - name: Prepare native resources
      if: inputs.lookup-only != 'true'
      shell: bash
      working-directory: app/SiloUI
      env:
        GOTOOLCHAIN: local
        SILO_REQUIRE_GUEST_SILO: '1'
      run: python3 scripts/measure-command.py runtime-prepare -- npm run runtime:prepare
    # Restored archives can carry builds of older keys; only this build's msb and Git LFS entries
    # are kept, so what is saved or transferred below does not grow with every key.
    - name: Keep only this run's compiled runtime entries
      if: inputs.lookup-only != 'true'
      shell: bash
      working-directory: app/SiloUI
      env:
        GOTOOLCHAIN: local
        RUNTIME_TARGET: ${{ inputs.target }}
      run: node scripts/runtime-cache-entries.mjs keep-current --target "$RUNTIME_TARGET"
    - name: Warm application dependency downloads
      if: inputs.lookup-only != 'true' && inputs.save == 'true' && github.ref == 'refs/heads/main'
      shell: bash
      working-directory: app/SiloUI
      env:
        RUNTIME_TARGET: ${{ inputs.target }}
      run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target "$RUNTIME_TARGET"
    # A push to main saves on every exact miss, not only the warmer, so a runner image update or a
    # changed key is prepared once and then hits. Pull requests and tags never save.
    - name: Save public runtime cache
      if: inputs.lookup-only != 'true' && inputs.artifact-name == '' && (inputs.save == 'true' || github.event_name == 'push') && github.ref == 'refs/heads/main' && steps.runtime.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.runtime.outputs.cache-primary-key }}
        path: |
          app/SiloUI/src-tauri/target/runtime-cache/v*/msb-*
          app/SiloUI/src-tauri/target/runtime-cache/v*/microsandbox-*.tar.gz
          app/SiloUI/src-tauri/target/runtime-cache/v*/agentd-*
          app/SiloUI/src-tauri/target/runtime-cache/v*/licenses
          app/SiloUI/src-tauri/target/runtime-cache/v*/libkrunfw-*
          app/SiloUI/src-tauri/target/runtime-cache/v*/patched-builds/*/published/manifest.json
          app/SiloUI/src-tauri/target/runtime-cache/v*/patched-builds/*/published/msb
          app/SiloUI/src-tauri/target/runtime-cache/v*/patched-builds/*/published/silo-macos-gateway
          app/SiloUI/src-tauri/target/runtime-cache/dugite
          app/SiloUI/src-tauri/target/runtime-cache/git-lfs-transfer/*/source.tar.gz
          app/SiloUI/src-tauri/target/runtime-cache/git-lfs-transfer/*/builds
    - name: Save Cargo downloads
      if: inputs.lookup-only != 'true' && inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.cargo.outputs.cache-primary-key }}
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
