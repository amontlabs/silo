<!doctype html>
<html lang="en">
  <head>
    <script src="/theme.js"></script>
    <script>
      // A readable marker beside the session cookie: the header keeps the signed-in width from first paint.
      if (/(?:^|;\s*)workshop-hint=1(?:;|$)/.test(document.cookie)) document.documentElement.classList.add('ws-session');
    </script>
    <script>
      // The page shows once its fonts are in, so nothing is laid out in a fallback face and then changes
      // width. After 1.2 s it shows regardless, and at once when a font fails; the fonts swap in when they arrive.
      (() => {
        const root = document.documentElement;
        const show = () => root.classList.remove('fonts-pending');
        root.classList.add('fonts-pending');
        setTimeout(show, 1200);
        document.addEventListener('DOMContentLoaded', () => {
          const faces = ['italic 40px "IBM Plex Serif"', '15px "IBM Plex Serif"', '15px "IBM Plex Sans"', '12px "IBM Plex Mono"'];
          Promise.all(faces.map((face) => document.fonts.load(face))).then(show, show);
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="description" content="Silo's plan, part by part. Vote, comment or suggest a feature." />
    <meta property="og:title" content="Workshop — Silo" />
    <meta property="og:description" content="Silo's plan, part by part. Vote, comment or suggest a feature." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://silo.amontlabs.com/workshop" />
    <link rel="canonical" href="https://silo.amontlabs.com/workshop" />
    <title>Workshop — Silo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- First-paint sizing also applies before external styles arrive. -->
    <style>
      html { background: #f7f7f4; }
      html[data-theme="dark"] { background: #171a1b; }
      .fonts-pending body { visibility: hidden; }
      .out { width: 9px; height: 9px; margin-left: 5px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
      .site-header nav a { display: inline-flex; align-items: center; }
      body { margin: 0; }
      .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
      .brand { display: inline-flex; align-items: center; gap: 7px; font-size: 20px; font-weight: 500; }
      .brand svg { width: 22px; height: 22px; }
      .icon { width: 17px; height: 17px; }
      .skip-link { position: fixed; top: -80px; left: 20px; z-index: 20; }
      .skip-link:focus { top: 10px; }
      @media (max-width: 640px) {
        .site-header .brand { font-size: 18px; gap: 6px; }
        .site-header .brand svg { width: 20px; height: 20px; }
      }
    </style>
    <link rel="preload" href="/fonts/ibm-plex-serif-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/src/site.css" />
    <script type="module" src="/src/workshop/main.tsx"></script>
  </head>
  <body>
    <svg class="symbols" width="0" height="0" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="silo" viewBox="21.5 21.5 85 85">
          <g fill="none" stroke-width="7" stroke-linecap="round">
            <path
              d="M60.386 102.832A39 39 0 1 1 98.435 82.309"
              stroke="currentColor"
            />
            <path
              d="M88.625 72.344A26 26 0 1 1 75.804 40.834"
              stroke="currentColor"
            />
            <path
              d="M72.591 54.243A13 13 0 1 1 52.316 58.301"
              stroke="#ff9f0a"
            />
          </g>
        </symbol>
        <symbol id="out" viewBox="0 0 9 9"><path d="M2 7 7.5 1.5M3.2 1.5h4.3v4.3" /></symbol>
        <symbol id="github-icon" viewBox="0 0 24 24">
          <path
            d="M9 19c-4 1-4-2-6-2m14 5v-4a3.5 3.5 0 0 0-1-3c3-.3 6-1.5 6-6a4.5 4.5 0 0 0-1.2-3.2A4 4 0 0 0 20.7 2S19.5 1.7 17 3a12 12 0 0 0-6 0C8.5 1.7 7.3 2 7.3 2a4 4 0 0 0-.1 3.8A4.5 4.5 0 0 0 6 9c0 4.5 3 5.7 6 6a3.5 3.5 0 0 0-1 3v4"
            transform="translate(-2)"
          />
        </symbol>
      </defs>
    </svg>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page-shell workshop-shell">
      <header class="site-header joint">
        <a class="brand" href="/" aria-label="Silo home"
          ><svg width="22" height="22" aria-hidden="true"><use href="#silo" /></svg
          ><span>Silo</span></a
        >
        <nav aria-label="Main navigation">
          <a href="/workshop" aria-current="page">Workshop</a>
          <a href="https://github.com/amontlabs/silo">GitHub<svg class="out" aria-hidden="true"><use href="#out" /></svg></a>
        </nav>
        <div class="header-actions">
          <div class="theme-switch" data-theme-picker>
            <button class="theme-trigger" type="button" data-theme-trigger aria-label="Color theme" title="Color theme: System" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none" /></svg>
            </button>
            <div class="theme-menu" id="theme-menu" role="menu" aria-label="Color theme" hidden>
              <button type="button" role="menuitemradio" aria-checked="true" data-theme-option="system" tabindex="-1"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2" /><path d="M8 21h8m-4-4v4" /></svg><span>System</span><span class="theme-check" aria-hidden="true">✓</span></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-theme-option="light" tabindex="-1"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" /></svg><span>Light</span><span class="theme-check" aria-hidden="true">✓</span></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-theme-option="dark" tabindex="-1"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z" /></svg><span>Dark</span><span class="theme-check" aria-hidden="true">✓</span></button>
            </div>
          </div>
          <div class="ws-account-slot" id="workshop-account"></div>
        </div>
      </header>
      <main id="main" class="workshop">
        <div id="workshop-root"></div>
        <noscript><p class="ws-quiet">The Workshop needs JavaScript.</p></noscript>
      </main>
      <footer class="ws-foot">
        <a href="https://github.com/amontlabs/silo">Source code ↗</a>
        <a href="https://github.com/amontlabs/silo/issues">Report an issue ↗</a>
      </footer>
    </div>
  </body>
</html>
