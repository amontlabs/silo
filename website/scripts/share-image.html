<!doctype html>
<!-- The picture a link to the site shows when shared: public/og.png is a 1200 x 630 capture of this page, opened from the dev server. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Silo share image</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      html,

        height: 630px;

        color: #282a2f;
        font-family: 'IBM Plex Sans', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
      }
      .brand {

        left: 96px;
        top: 37px;

        letter-spacing: -1.3px;
      }
      .brand svg {

      }
      .address {

        right: 96px;
        top: 43px;
        margin: 0;
        font: 20px/1.4 'IBM Plex Mono', monospace;
        color: #666a73;
      }
      h1 {
        position: absolute;
        left: 92px;
        top: 160px;
        width: 1000px;
        margin: 0;
        font: italic 400 96px/1.08 'IBM Plex Serif', Georgia, serif;
        letter-spacing: -0.024em;
        color: #995700;
      }
      .pitch {
        position: absolute;
        left: 96px;
        top: 410px;
        width: 960px;
        margin: 0;
        font-size: 32px;
        line-height: 1.4;
        color: #666a73;
      }

  </head>
  <body>
    <svg class="frame" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
      <!-- The frame: two rails, a line under the header and one under the pitch, a diamond at each joint. -->
      <g stroke="#dfe1df">
        <path d="M60.5 0V630M1139.5 0V630M60 112.5H1140M60 550.5H1140" />
        <g fill="#f7f7f4">
          <rect x="-4" y="-4" width="8" height="8" transform="translate(60.5 112.5) rotate(45)" />
          <rect x="-4" y="-4" width="8" height="8" transform="translate(1139.5 112.5) rotate(45)" />
          <rect x="-4" y="-4" width="8" height="8" transform="translate(60.5 550.5) rotate(45)" />
          <rect x="-4" y="-4" width="8" height="8" transform="translate(1139.5 550.5) rotate(45)" />
        </g>
      </g>
    </svg>
    <div class="brand">
      <svg viewBox="21.5 21.5 85 85" aria-hidden="true">
        <g fill="none" stroke-width="7" stroke-linecap="round">

          <path d="M88.625 72.344A26 26 0 1 1 75.804 40.834" stroke="currentColor" />

    <p class="pitch">Silo records everything they do there, shows you what matters, and takes you back to any moment.</p>
