[package]
name = "silo-host"
version = "0.1.0"
description = "Stateless host helpers shared by the Silo app and engine (channel names, applications, notifications, system integrations, terminal, shutdown, installer lock)"
license = "MIT"
repository = "https://github.com/amontlabs/silo"
edition = "2021"
publish = false

[features]
# Linux desktop integrations (GIO and GTK: application discovery, autostart entries,
# notifications). The app keeps it; the engine daemon builds without it so a headless
# Linux host needs no GTK. No effect on macOS.
default = ["desktop"]
desktop = ["dep:base64", "dep:gio", "dep:gtk"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
libc = "0.2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["block2"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
objc2-user-notifications = { version = "0.3.2", features = ["UNNotificationSettings", "UNUserNotificationCenter", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
base64 = { version = "0.23", optional = true }
gio = { version = "0.18", optional = true }
gtk = { version = "0.18", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
