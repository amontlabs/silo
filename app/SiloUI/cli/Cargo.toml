[package]
name = "silo-cli"
version = "0.1.0"
description = "The silo command line and MCP server: drive computers and forks through the engine"
license = "MIT"
repository = "https://github.com/amontlabs/silo"
edition = "2021"
publish = false

[[bin]]
name = "silo"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
silo-api = { path = "../api" }
silo-client = { path = "../client" }
time = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-std"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
