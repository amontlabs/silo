[package]
name = "silo-engine"
version = "0.1.0"
edition = "2021"
publish = false

[features]
test-support = []

[dependencies]
silo-api = { path = "../../api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
libc = "0.2"
microsandbox-image = { git = "https://github.com/superradcompany/microsandbox", rev = "09df3d4b9d832adaede1fb9a198cfc660bfab8cd", package = "microsandbox-image" }
microsandbox-utils = { git = "https://github.com/superradcompany/microsandbox", rev = "09df3d4b9d832adaede1fb9a198cfc660bfab8cd", package = "microsandbox-utils" }
sha2 = "0.10"
zeroize = "1"
hmac = "0.12"
plist = "1"
flate2 = "1"
tar = "0.4"
zstd = { version = "0.14", default-features = false }
time = { version = "0.3", features = ["parsing", "formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["block2"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
objc2-user-notifications = { version = "0.3.2", features = ["UNNotificationSettings", "UNUserNotificationCenter", "block2"] }
block2 = "0.6"
# keyring 3.6 reports Keychain failures as this exact security-framework version.
keychain-status = { package = "security-framework", version = "2.11" }
keychain-status-sys = { package = "security-framework-sys", version = "2.17" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2-virtualization = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
zbus = "5"
gio = "0.18"
gtk = "0.18"
