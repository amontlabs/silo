[package]
name = "silo-engine"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/amontlabs/silo"
edition = "2021"
publish = false

[build-dependencies]
serde_json = "1"

[features]
test-support = []

[dependencies]
silo-api = { path = "../../api" }
# Without the Linux desktop integrations (GTK): the engine runs in the headless daemon.
silo-host = { path = "../../host", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.23"
libc = "0.2"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
microsandbox-image = { git = "https://github.com/superradcompany/microsandbox", rev = "60fc5071b34e6cc2671c84c8dc07709795d45d27", package = "microsandbox-image" }
microsandbox-utils = { git = "https://github.com/superradcompany/microsandbox", rev = "60fc5071b34e6cc2671c84c8dc07709795d45d27", package = "microsandbox-utils" }
oci-spec = { version = "0.10", default-features = false, features = ["runtime"] }
sha2 = "0.10"
zeroize = "1"
hmac = "0.12"
plist = "1"
flate2 = "1"
tar = "0.4"
zstd = { version = "0.14", default-features = false }
time = { version = "0.3", features = ["parsing", "formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
hyper = { version = "1", default-features = false, features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The SSH server of container computers (`containers/ssh.rs`). Apache-2.0. ed25519 and ECDSA keys only: the
# `rsa` feature would bring the `rsa` crate, which has an unfixed timing side channel (RUSTSEC-2023-0071).
russh = { version = "=0.65.1", default-features = false, features = ["ring"] }
psl = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["block2"] }
block2 = "0.6"
# keyring 3.6 reports Keychain failures as this exact security-framework version.
keychain-status = { package = "security-framework", version = "2.11" }
# ... and the Keychain calls that go through the SecItem API as this one.
keychain-status-v3 = { package = "security-framework", version = "3.7" }
keychain-status-sys = { package = "security-framework-sys", version = "2.17" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2-virtualization = "0.3.2"
