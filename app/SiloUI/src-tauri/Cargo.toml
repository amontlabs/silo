[package]
name = "silo-ui"
version = "0.11.1"
description = "Desktop app for local and remote Linux guest computers on macOS."
license = "MIT"
homepage = "https://silo.amontlabs.com"
repository = "https://github.com/amontlabs/silo"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1"

[dependencies]
silo-api = { path = "../api" }
silo-client = { path = "../client" }
semver = "1"
silo-host = { path = "../host" }
tauri = { version = "2.11.3", features = ["macos-private-api", "image-png", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7"
# Single-instance guard: the official Tauri plugin (D-Bus on Linux, a Unix socket on macOS).
# 2.4.x is the newest line that supports the pinned Tauri 2.11; see docs/SiloUI-REVIEW-DESIGN-NOTES.md (F-09).
tauri-plugin-single-instance = "~2.4.5"
tauri-plugin-opener = "~2.5.5"
tauri-plugin-updater = "=2.11.0"
tokio = { version = "1", features = ["sync", "time", "macros", "signal", "net", "rt"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["block2"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
objc2-user-notifications = { version = "0.3.2", features = ["UNNotificationSettings", "UNUserNotificationCenter", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
# logind delay inhibitor for graceful shutdown (F-20). Already in the graph through ksni.
zbus = "5"
gtk = "0.18"

# The two engine probes under examples/ (desktop-viewer-probe, recovery-probe) compile engine
# modules in place; the app itself does not use these.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
objc2-virtualization = "0.3.2"

[dev-dependencies]
base64 = "0.22"
libc = "0.2"
tauri = { version = "2.11.3", features = ["test"] }
toml = "0.9"
