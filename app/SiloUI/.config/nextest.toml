# CI runs every test to the end and prints failures again at the end of the run.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"

# tools/agent/check runs every test once; a failure is a failure.
[profile.check]
fail-fast = false
failure-output = "immediate-final"

# The SSH listener tests pick a free port, release it and bind it again later,
# and assert that a dropped listener refuses connections. Under libtest the
# shared isolation guard kept them apart; here one test group keeps them from
# reusing each other's freed ports.
[test-groups]
ssh-listener-ports = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(silo-engine) and test(/^ssh_access::/)'
test-group = 'ssh-listener-ports'

# The slowest tests start first. Measured with one run per test (seconds in the comments).
[[profile.default.overrides]]
filter = '''
(package(silo-engine) and test(=runtime::tests::a_full_journal_keeps_its_first_event_and_drops_the_oldest_progress))
  or (package(silo-engine) and test(=changes::tests::large_baselines_subtract_in_linear_time))
  or (package(silod) and test(=methods::gate::tests::the_jobs_of_deleted_computers_stop_counting_once_they_are_over))
  or (package(silo-engine) and test(=host_push::tests::discovery_keeps_repositories_beyond_two_hundred_entries))
  or (package(silo-engine) and test(=engine_update::tests::a_crash_during_recovery_is_settled_by_the_next_owner_without_replay))
  or (package(silo-engine) and test(=engine_update::tests::a_crash_at_any_journal_write_never_loses_or_replays_a_saved_computer))
  or (package(silod) and test(=methods::gate::tests::the_jobs_of_a_deleted_computer_count_until_the_registry_releases_them))
  or (package(silo-engine) and test(=engine_update::tests::a_crash_at_any_boundary_of_an_abort_after_release_never_replays_a_resumed_guest))
  or (package(silo-engine) and test(=computer_use::tests::recording_an_attempt_never_loses_the_users_choice))
  or (package(silo-engine) and test(=engine_update::tests::a_crash_at_any_boundary_of_a_rollback_never_replays_a_resumed_guest))
  or (package(silo-engine) and test(=engine_update::tests::a_crash_at_any_boundary_of_an_abort_never_replays_a_resumed_guest))
  or (package(silo-engine) and test(=runtime::storage::tests::history_retains_latest_fifty_attempts_including_failures))
'''
priority = 100

