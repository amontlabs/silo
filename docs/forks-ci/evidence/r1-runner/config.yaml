github:
  configUrl: https://github.com/0xpolarzero/silo-runner-e2e
  auth: {tokenEnv: SILO_RUNNER_TOKEN}
silo:
  path: ~/.local/bin/silo-dev
  projectDir: ~/code/projects/silo-dev-target-logs/r1/project
stateDir: ~/code/projects/silo-dev-target-logs/r1/state
limits: {readyTimeout: 5m}
runnerRefresh: {disabled: true}
scaleSets:
  - {label: silo-linux-r1, recipe: silo-linux, os: linux, maxRunners: 2, keepFailed: {count: 2, days: 1}}
