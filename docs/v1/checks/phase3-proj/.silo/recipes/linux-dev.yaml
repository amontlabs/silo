# Overrides the built-in linux-dev for the phase 3 check: same packages plus a tiny web app on :3000.
os: linux
packages:
  apt: [build-essential, jq, ripgrep, python3, cron]
setup:
  - |
    mkdir -p /opt/p3web
    cat > /opt/p3web/server.py <<'PY'
    import socket, http.server
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            body = ("host=%s content=v1\n" % socket.gethostname()).encode()
            self.send_response(200); self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
        def log_message(self, *a): pass
    http.server.ThreadingHTTPServer(("0.0.0.0", 3000), H).serve_forever()
    PY
services:
  web: python3 /opt/p3web/server.py
ports: [3000]
