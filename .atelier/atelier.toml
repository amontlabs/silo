atelier = "0.2.1"
integration_branch = "main"
promotion_wait_seconds = 300

[[prerequisites.tools]]
name = "node"
run = ["node", "--version"]
expect = "v26."

[[prerequisites.tools]]
name = "lychee"
run = ["lychee", "--version"]
expect = "lychee 0.24.2"

# Before the steps. It writes only git-ignored files.
[[check.prepare]]
name = "website-deps"
run = ["tools/ci/check.sh", "deps"]

# The parts of tools/ci/check.sh, in its order; CI runs the whole script.
[[check.steps]]
name = "typecheck"
run = ["tools/ci/check.sh", "typecheck"]
compile = true

[[check.steps]]
name = "test-suites"
run = ["tools/ci/check.sh", "tests"]

[[check.steps]]
name = "website-build"
run = ["tools/ci/check.sh", "build"]

[[check.steps]]
name = "plan-check"
run = ["tools/ci/check.sh", "plan"]

[[check.steps]]
name = "links"
run = ["tools/ci/check.sh", "links"]

[platforms.macos-aarch64]
run = "check"
