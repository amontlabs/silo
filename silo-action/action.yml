name: Silo fork and review
description: Fork a Silo computer on a self-hosted Mac runner, run a command in the fork, post the review summary, and open a pull request or a review request.
author: amontlabs
branding:
  icon: git-branch
  color: gray-dark

inputs:
  recipe:
    description: Recipe to build main from (`silo up --recipe`). Leave empty to fork `from`.
    required: false
    default: ''
  from:
    description: Computer to fork when `recipe` is empty.
    required: false
    default: main
  run:
    description: Command to run in the fork.
    required: true
  secrets:
    description: Names of Silo secrets to give the fork, separated by spaces, commas or newlines. A fork gets none unless you name them.
    required: false
    default: ''
  fold:
    description: What to do with the result. `pr` opens a pull request with `silo fold --pr`, `request` records a review request, `none` only reviews.
    required: false
    default: pr
  keep-fork:
    description: Leave the fork in place after the job (`true` or `false`).
    required: false
    default: 'false'
  silo-path:
    description: The silo executable.
    required: false
    default: silo

outputs:
  fork:
    description: Name of the fork.
    value: ${{ steps.silo.outputs.fork }}
  exit-code:
    description: Exit code of the command.
    value: ${{ steps.silo.outputs.exit-code }}
  pr-url:
    description: URL of the pull request, when `fold` is `pr`.
    value: ${{ steps.silo.outputs.pr-url }}
  request-id:
    description: Id of the review request, when `fold` is `request`.
    value: ${{ steps.silo.outputs.request-id }}

runs:
  using: composite
  steps:
    - id: silo
      shell: sh
      env:
        INPUT_RECIPE: ${{ inputs.recipe }}
        INPUT_FROM: ${{ inputs.from }}
        INPUT_RUN: ${{ inputs.run }}
        INPUT_SECRETS: ${{ inputs.secrets }}
        INPUT_FOLD: ${{ inputs.fold }}
        INPUT_KEEP_FORK: ${{ inputs.keep-fork }}
        INPUT_SILO_PATH: ${{ inputs.silo-path }}
        GITHUB_TOKEN: ${{ github.token }}
        SILO_GITHUB_API_URL: ${{ github.api_url }}
      run: sh "${{ github.action_path }}/run.sh"
